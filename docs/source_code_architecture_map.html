<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lagrangian 系集逆向溯源｜程式架構追蹤地圖</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #64748b;
      --line: #cbd5e1;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --accent: #2563eb;
      --import: #2563eb;
      --flow: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #eef3f8;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    }
    .page { max-width: 1780px; margin: 0 auto; padding: clamp(12px, 2vw, 22px); }
    header { margin-bottom: 14px; }
    h1 { margin: 0 0 5px; font-size: clamp(22px, 2.2vw, 32px); letter-spacing: .01em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .toolbar {
      display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      margin: 14px 0; padding: 11px 14px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 10px;
    }
    .search { display: flex; min-width: 0; align-items: center; gap: 8px; flex: 1 1 260px; }
    .search label { color: var(--muted); font-size: 13px; white-space: nowrap; }
    input[type="search"] { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid #b6c3d1; border-radius: 7px; font: inherit; }
    input[type="search"]:focus { outline: 3px solid #bfdbfe; border-color: var(--accent); }
    .toggle { display: inline-flex; align-items: center; gap: 6px; color: #475569; font-size: 13px; white-space: nowrap; }
    .toggle input { accent-color: var(--accent); }
    button {
      border: 1px solid #94a3b8; border-radius: 7px; padding: 7px 11px; background: #fff;
      color: #334155; font: inherit; cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .legend { display: inline-flex; align-items: center; gap: 12px; margin-left: auto; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-line { display: inline-block; width: 25px; border-top: 2px solid var(--import); }
    .legend-line.flow { border-top: 2px dashed var(--flow); }
    .workspace { display: grid; min-width: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 350px); gap: 14px; align-items: start; }
    .map-panel, .detail-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .map-panel { min-width: 0; overflow: auto; }
    svg { display: block; width: max(100%, var(--map-width, 0px)); max-width: none; height: auto; background: linear-gradient(180deg, #fbfdff 0%, #f4f8fc 100%); }
    .group-panel { fill: #fff; fill-opacity: .8; stroke-width: 2; }
    .group-title { font-size: 18px; font-weight: 700; }
    .group-description { fill: var(--muted); font-size: 11px; }
    .node { cursor: pointer; }
    .node rect { fill: #fff; stroke: #94a3b8; stroke-width: 1.3; transition: opacity .16s, stroke-width .16s, filter .16s; }
    .node:hover rect, .node:focus rect { stroke: var(--accent); stroke-width: 2.5; outline: none; }
    .node-title { fill: var(--ink); font-size: 15px; font-weight: 700; pointer-events: none; }
    .node-role { fill: #475569; font-size: 11px; pointer-events: none; }
    .node-file { fill: #64748b; font-size: 10px; pointer-events: none; }
    .edge { fill: none; pointer-events: none; transition: opacity .16s, stroke-width .16s; }
    .edge.import { stroke: var(--import); stroke-width: 1.15; opacity: .17; }
    .edge.flow { stroke: var(--flow); stroke-width: 2; stroke-dasharray: 7 5; opacity: .24; }
    .edge-label { fill: #9a5b08; font-size: 10px; opacity: .42; pointer-events: none; }
    .node.is-selected rect { stroke: var(--accent); stroke-width: 3; filter: drop-shadow(0 3px 4px rgba(37,99,235,.18)); }
    .node.is-related rect { stroke: #0f766e; stroke-width: 2.2; }
    .node.is-dim, .edge.is-dim, .edge-label.is-dim { opacity: .08; }
    .edge.is-highlight.import { opacity: .9; stroke-width: 2.6; }
    .edge.is-highlight.flow { opacity: .95; stroke-width: 3.1; }
    .detail-panel { position: sticky; top: 14px; min-width: 0; padding: 18px; min-height: 540px; overflow-wrap: anywhere; }
    .detail-kicker { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    .detail-panel h2 { margin: 5px 0 8px; font-size: 23px; }
    .detail-role { margin: 0 0 14px; font-size: 14px; line-height: 1.6; }
    .detail-section { border-top: 1px solid #e2e8f0; padding-top: 11px; margin-top: 12px; }
    .detail-section h3 { margin: 0 0 6px; font-size: 12px; color: #475569; letter-spacing: .04em; }
    .detail-section p { margin: 0; color: #334155; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .detail-section ul { margin: 5px 0 0; padding-left: 19px; color: #334155; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
    .code-link { display: inline-block; margin-top: 15px; color: var(--accent); font-size: 13px; }
    .code-link:hover { text-decoration: underline; }
    .status { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    footer { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 1fr; }
      .detail-panel { position: static; min-height: 0; }
      .legend { margin-left: 0; width: 100%; }
    }
    @media (max-width: 560px) {
      .toolbar { align-items: stretch; }
      .search { flex-basis: 100%; }
      .toggle { flex: 0 1 auto; }
      .legend { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Lagrangian 系集逆向溯源｜程式架構追蹤地圖</h1>
      <p class="subtitle">先看五個責任群組，再點選任一檔案追蹤「它引用誰、誰引用它、資料在流程中的位置」。本圖由目前 <code>src/lagrangian_backtracking/</code> 的相對匯入自動整理。</p>
    </header>
    <section class="toolbar" aria-label="架構地圖控制列">
      <div class="search">
        <label for="module-search">搜尋模組</label>
        <input id="module-search" type="search" placeholder="例如 runner、forcing、受體" autocomplete="off">
      </div>
      <label class="toggle"><input id="show-imports" type="checkbox" checked> 實際 import</label>
      <label class="toggle"><input id="show-flow" type="checkbox" checked> 資料／控制流程</label>
      <button id="reset-selection" type="button">回到 runtime</button>
      <div class="legend" aria-label="箭頭圖例">
        <span class="legend-item"><span class="legend-line"></span>實際相對 import</span>
        <span class="legend-item"><span class="legend-line flow"></span>文件化流程</span>
      </div>
    </section>
    <main class="workspace">
      <section class="map-panel" aria-label="程式架構圖，可點選節點">
        <svg id="architecture-map" viewBox="0 0 1 1" role="img" aria-labelledby="map-title map-description">
          <title id="map-title">Lagrangian 系集逆向溯源程式模組與流程關係</title>
          <desc id="map-description">五個模組群組依目前模組數量動態排列，實線表示原始碼相對 import，虛線表示文件化資料或控制流程。點選模組可在右側閱讀引用關係。</desc>
          <defs>
            <marker id="import-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#2563eb"></path></marker>
            <marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#d97706"></path></marker>
          </defs>
          <g id="group-layer"></g>
          <g id="edge-layer"></g>
          <g id="node-layer"></g>
        </svg>
      </section>
      <aside id="detail-panel" class="detail-panel" aria-live="polite"></aside>
    </main>
    <footer>
      實線只表示模組層級的相對 <code>import</code>，不宣稱每條線都是函式直接呼叫；虛線是文件化的資料／控制流程。若要追到函式級行為，從右側「主要閱讀入口」開啟對應原始碼，再回看測試與文件 11 的追溯表。
    </footer>
  </div>
  <script>
    const modules = [{"id":"config","title":"config.py","group":"data","groupLabel":"資料與幾何","order":0,"source":"../src/lagrangian_backtracking/config.py","role":"科學設定契約與正式發布閘門","inputs":"YAML 設定、資料根目錄與五站範圍","outputs":"ProjectConfig；驗證四個 forcing domain、五站與情境計數","entrypoints":["ProjectConfig","load_config"],"read_first":"先確認哪些設定可以進入正式發布，以及 10 × 20 × 50 的不可縮減契約。"},{"id":"preflight","title":"preflight.py","group":"data","groupLabel":"資料與幾何","order":1,"source":"../src/lagrangian_backtracking/preflight.py","role":"上游月份、資料品質與時間支援盤點","inputs":"OCM／NWW3 metadata、月份檔與預期時間軸","outputs":"PreflightReport；缺時、schema、維度與可用時間證據","entrypoints":["run_preflight","PreflightReport"],"read_first":"先看它如何把資料可用性問題寫成可追溯報告，而不是默默補值。"},{"id":"time_axis","title":"time_axis.py","group":"data","groupLabel":"資料與幾何","order":2,"source":"../src/lagrangian_backtracking/time_axis.py","role":"跨月份的唯一 UTC 時間軸","inputs":"各月份的時間片段與預期時間間隔","outputs":"CanonicalTimeAxis、TimeChunk 與 GapInterval","entrypoints":["canonicalize_time_chunks","CanonicalTimeAxis"],"read_first":"確認跨月拼接、缺時區段與粒子可回溯時間範圍的定義。"},{"id":"geometry","title":"geometry.py","group":"data","groupLabel":"資料與幾何","order":3,"source":"../src/lagrangian_backtracking/geometry.py","role":"經緯度與公尺座標、局部範圍及多邊形穿越","inputs":"經緯度、候選框、共同 flow domain 與 local domain","outputs":"DomainProjection、Polygon 與 SegmentCrossing","entrypoints":["DomainProjection","build_anchor_local_domain","first_polygon_crossing"],"read_first":"貢寮／龜山島 local domain 可重疊，但 forcing 與最外層停止邊界另有契約。"},{"id":"mesh","title":"mesh.py","group":"data","groupLabel":"資料與幾何","order":4,"source":"../src/lagrangian_backtracking/mesh.py","role":"原始 OCM 三角網格的定位與插值準備","inputs":"節點座標、三角面與公尺座標投影","outputs":"NativeMesh、MeshLocation 與面索引","entrypoints":["NativeMesh","triangulate_faces"],"read_first":"了解粒子如何找到原始網格面，避免把規則格網假設帶入 OCM。","baytrace_integration":"借鑑 BayTrace 對 SCHISM 網格快速定位與 triangle hint 的思路；本專案以 native schema 的原始 face、鄰接關係與公尺座標重新實作，提示只改善搜尋效率，不改變物理結果。"},{"id":"receptors","title":"receptors.py","group":"data","groupLabel":"資料與幾何","order":5,"source":"../src/lagrangian_backtracking/receptors.py","role":"每站 20 個三維受體的可重現選取","inputs":"濕潤網格面、local domain、垂向層位與品質指標","outputs":"HorizontalReceptor、VerticalTarget","entrypoints":["select_horizontal_receptors","build_vertical_targets"],"read_first":"先看水平 5 點與垂向 4 層如何形成每站 20 個 receptors。"},{"id":"arrival_times","title":"arrival_times.py","group":"data","groupLabel":"資料與幾何","order":6,"source":"../src/lagrangian_backtracking/arrival_times.py","role":"每站 50 個到達時刻的分層選取","inputs":"CanonicalTimeAxis、資料品質與缺時區段","outputs":"ArrivalTime 清單；48 個分層時刻加 2 個事件時刻","entrypoints":["select_arrival_times"],"read_first":"確認到達時刻不是任意等距抽樣，而要避開不可用時間。"},{"id":"manifests","title":"manifests.py","group":"data","groupLabel":"資料與幾何","order":7,"source":"../src/lagrangian_backtracking/manifests.py","role":"嚴格讀取並綁定 material、receptor、arrival 與巢狀邊界 manifest","inputs":"版本化 JSON、ProjectConfig、WGS84 幾何與 native initial-condition provenance","outputs":"ScenarioInputs、BoundaryGeometry、canonical/raw hash 與 formal／pilot coverage 判定","entrypoints":["load_scenario_inputs","load_boundary_geometries","load_receptor_arrival_initial_condition_manifest"],"read_first":"先看 unknown key、缺值、跨參照、CRS、座標與公尺制物理不等式如何在 runtime 前 fail-fast。"},{"id":"input_derivation","title":"input_derivation.py","group":"data","groupLabel":"資料與幾何","order":8,"source":"../src/lagrangian_backtracking/input_derivation.py","role":"由已驗收 OCM／NWW3 產品衍生可重建的輸入 manifest 與 release config","inputs":"OCM schema 3 native／surface、NWW3 schema 1 analysis、ProjectConfig、UTC 時間軸、原始三角網格與站點幾何","outputs":"固定檔名的 component JSON、相鄰 SHA-256 binding、artifact_index，以及可供 runtime 使用的 approved／generated release config","entrypoints":["build_input_derivatives","validate_input_derivatives","create_release_config","validate_release_config","write_canonical_json","read_canonical_json"],"read_first":"這是正式 runtime 的輸入前置閘門：只讀已驗收產品，不回讀 raw NetCDF；缺時、symbolic link、schema、幾何支援與 component hash 任一不符都要 fail-closed，不能以最近值、零值或 synthetic fallback 補齊。"},{"id":"models","title":"models.py","group":"physics","groupLabel":"物理與邊界","order":0,"source":"../src/lagrangian_backtracking/models.py","role":"所有模組共用的資料型別與狀態契約","inputs":"無外部資料；由其他模組建立狀態與品質旗標","outputs":"ParticleState、VelocitySample、BoundaryEvent、ParticleStatus","entrypoints":["ParticleState","VelocitySample","BoundaryEvent"],"read_first":"先建立欄位、單位、品質旗標與停止狀態的共同語言。"},{"id":"forcing","title":"forcing.py","group":"physics","groupLabel":"物理與邊界","order":1,"source":"../src/lagrangian_backtracking/forcing.py","role":"OCM 海流與 NWW3 波浪的時空取樣與合成","inputs":"原始網格、時間軸、粒子位置、深度與波浪條件","outputs":"OCMNativeMonth、NWWAnalysisMonth、CombinedMonthForcing","entrypoints":["OCMNativeMonth.sample","NWWAnalysisMonth.sample","CombinedMonthForcing"],"read_first":"確認海流、Stokes 漂流、向下沉降與擴散係數的資料來源與遮罩；正式 v2 不含上浮情境。"},{"id":"forcing_window","title":"forcing_window.py","group":"physics","groupLabel":"物理與邊界","order":2,"source":"../src/lagrangian_backtracking/forcing_window.py","role":"依 UTC 月份 lazy 載入並限制 resident forcing cache","inputs":"flow domain、NativeMesh、OCM/NWW schema 產品根目錄與粒子 UTC stage","outputs":"ForcingWindowManager、material facade、CombinedMonthForcing 與 immutable cache stats","entrypoints":["ForcingWindowManager","ForcingWindowManager.from_roots"],"read_first":"月份選擇只依 UTC 時間，缺月、產品損壞與波浪不可用需維持不同品質狀態；manager 是單一 process 使用的 lazy LRU。"},{"id":"accelerated","title":"accelerated.py","group":"physics","groupLabel":"物理與邊界","order":3,"source":"../src/lagrangian_backtracking/accelerated.py","role":"OCM 垂向欄位插值的可選加速核心","inputs":"已整理的 OCM 欄位、粒子水平位置與垂向索引","outputs":"Numba 加速的支援值；結果須與參考核心一致","entrypoints":["interpolate_ocm_support_numba"],"read_first":"它是效能替代路徑，不改變科學公式；先與 forcing 的參考路徑對照。"},{"id":"stokes","title":"stokes.py","group":"physics","groupLabel":"物理與邊界","order":4,"source":"../src/lagrangian_backtracking/stokes.py","role":"由波浪條件計算有限水深 Stokes 漂流","inputs":"波高、週期／頻率、波向、波長與水深","outputs":"StokesResult 與水平漂流速度","entrypoints":["solve_wave_number","finite_depth_stokes","deep_water_stokes"],"read_first":"先確認波向轉換、色散關係與深水／有限水深極限。"},{"id":"diffusion","title":"diffusion.py","group":"physics","groupLabel":"物理與邊界","order":5,"source":"../src/lagrangian_backtracking/diffusion.py","role":"隨機漫步與 Smagorinsky 水平擴散係數","inputs":"Kx、Ky、Kz、時間步長與速度梯度候選值","outputs":"DiffusionCoefficients、TimeStepDecision 與 Brownian 位移","entrypoints":["brownian_displacement","smagorinsky_horizontal_diffusivity","choose_time_step"],"read_first":"隨機擴散在 RK4 後獨立加入，不可混入 RK4 stage。"},{"id":"integrators","title":"integrators.py","group":"physics","groupLabel":"物理與邊界","order":6,"source":"../src/lagrangian_backtracking/integrators.py","role":"負時間步的四階 Runge-Kutta 與擴散分裂","inputs":"ParticleState、VelocityProvider、時間步長與擴散係數","outputs":"下一個 ParticleState 或 SamplingError","entrypoints":["rk4_step","split_rk4_brownian_step"],"read_first":"確認逆向只把時間步取反一次，並把隨機位移放在積分後。"},{"id":"boundaries","title":"boundaries.py","group":"physics","groupLabel":"物理與邊界","order":7,"source":"../src/lagrangian_backtracking/boundaries.py","role":"水平／垂向邊界事件與穿越點解析","inputs":"提議的新位置、local／flow domain、海岸、海面與海床","outputs":"BoundaryEvent、修正後狀態與停止／繼續判定","entrypoints":["BoundaryGeometry","resolve_horizontal_boundaries","resolve_vertical_boundaries"],"read_first":"先分清自站 local exit、跨站診斷、flow open exit、海岸與資料停止。"},{"id":"engine","title":"engine.py","group":"physics","groupLabel":"物理與邊界","order":8,"source":"../src/lagrangian_backtracking/engine.py","role":"單一粒子回溯主迴圈與停止控制","inputs":"ReferenceParticleRequest、VelocityProvider、BoundaryGeometry","outputs":"ParticleResult；觀測、事件、最終狀態與停止原因","entrypoints":["EngineSettings","run_particle","ParticleResult"],"read_first":"這是最接近一條軌跡完整生命週期的模組，串起取樣、積分與邊界。"},{"id":"scenarios","title":"scenarios.py","group":"batch","groupLabel":"批次與重啟","order":0,"source":"../src/lagrangian_backtracking/scenarios.py","role":"建立 10 × 20 × 50 的基礎情境與成員種子","inputs":"10 種非上浮材質／形狀代理、20 個 receptors、50 個到達時刻與 master seed","outputs":"Scenario、穩定 scenario_id 與每成員可重現 seed","entrypoints":["build_scenarios","derive_member_seed","validate_baseline_coverage"],"read_first":"先確認基礎情境與 M 個隨機成員是兩個不同層次。","baytrace_integration":"吸收 BayTrace 對 RNG seeding 必須明確綁定粒子身分的教訓；本專案由粒子識別資料經 SHA-256 派生 128-bit PCG64DXSM seed，讓 chunk、shard 與 restart 不改變結果。"},{"id":"pilot_selection","title":"pilot_selection.py","group":"batch","groupLabel":"批次與重啟","order":1,"source":"../src/lagrangian_backtracking/pilot_selection.py","role":"依固定分層與 SHA-256 排序建立工程 pilot 情境子集","inputs":"完整且已驗證的 Scenario／Receptor 清單、每層容量與 selection policy","outputs":"scenario selection binding；完整來源數／雜湊、選取數／雜湊與分層摘要","entrypoints":["build_full_scenario_selection","select_pilot_scenarios","apply_scenario_selection","validate_scenario_selection_binding_shape"],"read_first":"pilot 只服務工程 sanity／benchmark；selector 以 study_site_id × vertical_id 分層，不改 formal 的完整 10 × 20 × 50 coverage，也不保存一長串 scenario ID。"},{"id":"runner","title":"runner.py","group":"batch","groupLabel":"批次與重啟","order":2,"source":"../src/lagrangian_backtracking/runner.py","role":"把情境展開成粒子 RunUnit 並切成可重跑批次","inputs":"ScenarioShard、master seed、forcing 與邊界設定","outputs":"RunUnit、ParticleResult 與 shard 執行結果","entrypoints":["plan_scenario_shards","iter_run_units","run_reference_shard"],"read_first":"沿著它追 `scenario × M` 如何進入 engine，以及如何維持 member_id。","baytrace_integration":"延續 BayTrace RNG seeding 對執行切分穩定性的提醒；RunUnit 的每粒子 SHA-256 128-bit PCG64DXSM seed 與固定 identity 綁定，因此重新分 chunk、shard 或 restart 不會依賴 worker 順序。"},{"id":"batch_state","title":"batch_state.py","group":"batch","groupLabel":"批次與重啟","order":3,"source":"../src/lagrangian_backtracking/batch_state.py","role":"保存 CPU 批次的 SoA 粒子狀態與作用中索引","inputs":"ParticleState 序列、ParticleStatus 與 native mesh triangle hint","outputs":"ParticleBatch；固定身分、動態欄位、狀態碼、active compaction 與 scatter","entrypoints":["ParticleBatch","PARTICLE_STATUS_TO_CODE"],"read_first":"先分清不可變的粒子身分與可更新的公尺制位置、時間、狀態及 triangle hint，避免壓縮後錯位回寫。","baytrace_integration":"借鑑 BayTrace ParticleArrays 的 structure-of-arrays 排列；本專案改以 ParticleState／ParticleStatus 契約保存欄位、狀態碼與 identity-safe scatter，不直接搬入 BayTrace 資料型別。"},{"id":"production","title":"production.py","group":"batch","groupLabel":"批次與重啟","order":4,"source":"../src/lagrangian_backtracking/production.py","role":"以 CPU/NumPy 執行可暫停的分塊粒子批次","inputs":"ScenarioShard、RuntimeRequestFactory、ParticleBatch 與 reference engine 單步介面","outputs":"固定順序的 ParticleResult、checkpoint-ready execution state 與 batch 摘要","entrypoints":["ProductionBatch","run_production_shard"],"read_first":"確認 active mask、compaction、chunking 與 scatter 只改變執行排程，不改粒子 identity、物理呼叫或亂數序列。","baytrace_integration":"借鑑 BayTrace CPU batch 的 active mask／compaction 與 chunking；本專案目前只採 NumPy CPU，未帶入 GPU、CUDA 或 shared-memory multiprocessing。"},{"id":"checkpoint","title":"checkpoint.py","group":"batch","groupLabel":"批次與重啟","order":5,"source":"../src/lagrangian_backtracking/checkpoint.py","role":"schema 2 中途狀態的安全寫入與續跑繫結","inputs":"粒子中途狀態、批次識別與設定繫結","outputs":"schema 2 CheckpointBinding、execution/RNG checkpoint 與 schema 1 相容資料","entrypoints":["write_execution_checkpoint","load_execution_checkpoint","write_checkpoint（schema 1 相容入口）","load_checkpoint（schema 1 相容入口）"],"read_first":"正式續跑先讀 schema 2 的 write_execution_checkpoint／load_execution_checkpoint；列表中的 write_checkpoint／load_checkpoint 僅是既有 schema 1 相容入口，不能取代schema 2 的完整 execution、觀測、事件、triangle hint 與每粒子 RNG state。","baytrace_integration":"這是為本專案可重啟系集補上的強化：schema 2 保存完整 execution、觀測、事件、triangle hint 與每粒子 RNG state，並非 BayTrace checkpoint 的原樣搬入。"},{"id":"cli","title":"cli.py","group":"control","groupLabel":"執行控制","order":0,"source":"../src/lagrangian_backtracking/cli.py","role":"正式 preflight、run workspace、分片執行、reconcile、aggregate 與 report 唯讀驗證入口","inputs":"命令列參數、設定檔與資料根目錄","outputs":"formal/pilot preflight、run lifecycle、shard 結果、aggregate 與 report 驗證報告","entrypoints":["main","run_preflight_command","run_create","run_shard","run_reconcile","run_validate_run","run_report_validate","report-validate"],"read_first":"正式鏈路依序閱讀 main → run_preflight_command（--formal-release）→ run_create → run_shard／run_reconcile → run_validate_run；synthetic 與設定檢查是輔助入口，不能取代 formal inventory gate。report-spec-create 只建立 renderer 規格；run_report_validate／report-validate 只讀取 caller 明示的既有 report-v1 release，不猜測路徑、不建立產品，也不把 engineering validator 通過稱為科學成果。"},{"id":"runtime","title":"runtime.py","group":"control","groupLabel":"執行控制","order":1,"source":"../src/lagrangian_backtracking/runtime.py","role":"把 pilot/formal run plan 與輸入 manifest 建成逐粒子 request factory","inputs":"schema 2 run workspace、normalized config、component／geometry manifest、formal preflight inventory、OCM/NWW roots 與 experiment case","outputs":"RuntimeRequestFactory、逐粒子 ReferenceParticleRequest 與 pilot/formal RunController facade","entrypoints":["initialize_run","initialize_formal_run","initialize_pilot_run","open_run_controller","RuntimeRequestFactory","open_formal_run_controller","open_pilot_run_controller"],"read_first":"先確認兩種 mode 如何綁定 pair initial condition、幾何 face provenance、forcing window 與 execution scalar；formal 另做完整 inventory topology、時間軸與 OCM gap-safe/full-product gate，任何不符都不得降級成 pilot。"},{"id":"pilot_calibration","title":"pilot_calibration.py","group":"control","groupLabel":"執行控制","order":2,"source":"../src/lagrangian_backtracking/pilot_calibration.py","role":"從 OCM 實值 pair 取樣建立 pilot 校準 evidence 與候選擴散參數","inputs":"已驗證 release config、ScenarioInputs／BoundaryGeometry、OCM-only forcing window、receptor × arrival dynamic initial-condition pairs","outputs":"固定 Arrow schema 的 pair_samples.parquet、calibration_report.json 與 manifest；包含 QC、候選 Kh／Kz／floor／cap、時間步候選及輸入／程式 provenance","entrypoints":["PilotCalibration","build_pilot_calibration","read_pilot_calibration","validate_pilot_calibration"],"read_first":"校準只產生條件式來源足跡流程的工程候選，不是已核定物理參數；OCM 取樣的無效值、wet/dry、缺時與 provenance 必須原樣保存，不能把無效速度改成零或讀取 NWW3。"},{"id":"pilot_config","title":"pilot_config.py","group":"control","groupLabel":"執行控制","order":3,"source":"../src/lagrangian_backtracking/pilot_config.py","role":"把校準候選與明示 pilot scalar 封裝成不可變的 generated 執行設定","inputs":"已驗證 source release config、schema 1.1 calibration evidence、gap-safe arrival manifest 與 caller 明示的 integration／boundary／execution scalar","outputs":"含 pilot_execution_binding 的 generated YAML；保存候選值、來源 hash、欄位與 scalar snapshot，供 run-create／run-shard 讀取但不宣稱 convergence 或 scientific approval","entrypoints":["create_pilot_execution_config","validate_pilot_execution_config"],"read_first":"建立器只能綁定已通過的 calibration evidence 與 input artifact；target config 不可 反過來當成 calibration source，且既有 final 不覆寫、候選值不由 CLI 另猜一份。"},{"id":"provenance","title":"provenance.py","group":"control","groupLabel":"執行控制","order":4,"source":"../src/lagrangian_backtracking/provenance.py","role":"建立不含絕對路徑的程式部署指紋","inputs":"pyproject.toml、uv.lock、src Python tree 與 Git／declared deployment 狀態","outputs":"CodeProvenance、deployment tree SHA-256、依賴版本與 formal dirty gate 證據","entrypoints":["collect_code_provenance","CodeProvenance"],"read_first":"正式 run 必須知道實際程式與依賴版本；pilot 可明示無 Git，但 formal 不接受 無法判定的部署狀態。"},{"id":"run_control","title":"run_control.py","group":"control","groupLabel":"執行控制","order":5,"source":"../src/lagrangian_backtracking/run_control.py","role":"管理 immutable run plan、atomic progress、CPU shard 與 reconcile","inputs":"schema 2 workspace、RunUnit、ProductionBatch、checkpoint/output 與 lock topology","outputs":"RunExecutionSummary、progress lifecycle、checkpoint pointer 與可恢復 run 狀態","entrypoints":["initialize_run_workspace","RunController","RunController.run_shard","RunController.reconcile"],"read_first":"plan 與 progress 的可變性、lock 順序、checkpoint generation 及 output-before-progress crash window 都是恢復正確性的核心。"},{"id":"run_locking","title":"run_locking.py","group":"control","groupLabel":"執行控制","order":6,"source":"../src/lagrangian_backtracking/run_locking.py","role":"以 Unix flock 保護 run、shard 與 progress 的互斥","inputs":"預建零長度 lock file、shared／exclusive 模式與 blocking policy","outputs":"安全的 acquire_run_lock context；contention 轉為 RunLockBusyError","entrypoints":["acquire_run_lock","RunLockBusyError"],"read_first":"鎖檔只表達 topology，實際互斥由 fcntl.flock 提供；NFS/NAS 語意仍須在目標環境另行 preflight。"},{"id":"run_validation","title":"run_validation.py","group":"control","groupLabel":"執行控制","order":7,"source":"../src/lagrangian_backtracking/run_validation.py","role":"唯讀驗證 schema 2 workspace、checkpoint、shard 與工程摘要","inputs":"run plan/progress、scenario／seed table、lock topology、checkpoint/output checksum","outputs":"JSON-safe valid/errors/summary 與 benchmark report；不修復現場檔案","entrypoints":["validate_run","benchmark_report"],"read_first":"驗證器要拒絕未知檔案、錯誤 checksum、錯誤 identity/order 與不合法 lifecycle，不能替 caller 偷修 progress 或刪除資料。"},{"id":"outputs","title":"outputs.py","group":"output","groupLabel":"輸出與聚合","order":0,"source":"../src/lagrangian_backtracking/outputs.py","role":"粒子軌跡、事件與檢查資料的原子發布","inputs":"完成的 ParticleResult 清單與正式 metadata","outputs":"trajectory shard、events、checksum 與 validate 報告","entrypoints":["write_trajectory_shard","validate_trajectory_shard"],"read_first":"先確認輸出不可覆寫、要有 checksum，且不完整 shard 不可進聚合。"},{"id":"event_aggregation","title":"event_aggregation.py","group":"output","groupLabel":"輸出與聚合","order":1,"source":"../src/lagrangian_backtracking/event_aggregation.py","role":"將粒子事件轉為固定拓撲的串流計數與分母","inputs":"已完成的 ParticleResult、AggregateSpec 與 BoundaryEvent／ParticleStatus","outputs":"SiteEventGridCounts、事件 key、EventAggregateChunk 與可合併的 EventAggregateAccumulator","entrypoints":["initialize_event_aggregate","aggregate_result_events","EventAggregateAccumulator","merge_event_aggregate_chunks"],"read_first":"事件計數必須保留 local／outer／bed／缺時／數值失敗等不同狀態；網格軸固定為 (y_cell, x_cell)，不能用零值取代無效成員，也不能以單一 chunk 掩蓋跨 shard 的 identity。"},{"id":"streaming_aggregation","title":"streaming_aggregation.py","group":"output","groupLabel":"輸出與聚合","order":2,"source":"../src/lagrangian_backtracking/streaming_aggregation.py","role":"以固定記憶體累加路徑訪格、停留秒數與首次進入年齡","inputs":"engine 產生的 ParticleResult、公尺制 x/y 格線與秒制 age 分箱","outputs":"StreamingPathwayAggregate；包含 unique member 計數、residence seconds、first-passage age histogram 與守恆摘要","entrypoints":["StreamingPathwayAccumulator","stream_pathway_first_passage","merge_streaming_pathway_aggregates","first_passage_quantiles"],"read_first":"相鄰觀測段會按格線穿越比例切段，停留時間以中點格分配；輸出軸固定為 (y_cell, x_cell[, age_bin])，不保存全量粒子點，也不執行 KDE。"},{"id":"aggregation","title":"aggregation.py","group":"output","groupLabel":"輸出與聚合","order":3,"source":"../src/lagrangian_backtracking/aggregation.py","role":"邊界密度、足跡、路徑、停留時間與跨站連通統計","inputs":"已驗證的事件、軌跡與有效分母","outputs":"KDEGrid、PathwayGrid、BoundaryArclengthHistogram 與摘要表","entrypoints":["conditional_kde_2d","pathway_residence_grid","boundary_arclength_histogram","cross_site_connectivity"],"read_first":"聚合結果是條件式來源足跡，不可直接稱為絕對來源機率。"},{"id":"aggregate_spec","title":"aggregate_spec.py","group":"output","groupLabel":"輸出與聚合","order":4,"source":"../src/lagrangian_backtracking/aggregate_spec.py","role":"固定彙整格網、邊界分箱、travel-age 與 KDE 研究規格","inputs":"已驗證 BoundaryGeometry、各站公尺制 AEQD 中心、格網與統計參數","outputs":"schema 1 AggregateSpec、SiteGridSpec、SiteBoundarySegments 與 metric CRS binding","entrypoints":["AggregateSpec","load_aggregate_spec","validate_aggregate_spec_against_boundaries","write_aggregate_spec_from_boundaries"],"read_first":"格網 extent、KDE bandwidth、HDR level 與 age edges 都是研究設計輸入；不能依軌跡 extent 或繪圖預設自動改動，也不能把經緯度直接當成公尺距離。"},{"id":"aggregate_release_records","title":"aggregate_release_records.py","group":"output","groupLabel":"輸出與聚合","order":5,"source":"../src/lagrangian_backtracking/aggregate_release_records.py","role":"封存聚合 release 的 shard 綁定與 scenario 分層資料列","inputs":"已驗證 trajectory shard metadata、ScenarioInputs 與每個 scenario 的動態初始條件","outputs":"AggregateShardBinding、ScenarioStratum 與可排序的 scenario strata records","entrypoints":["AggregateShardBinding","ScenarioStratum","scenario_inputs_to_strata"],"read_first":"這些列是 release 的 join key 與 provenance，不是來源機率；動態初始條件只能整組 有值或整組缺值，不能以零值替代乾點、缺時或未知資料。"},{"id":"aggregate_release_payload","title":"aggregate_release_payload.py","group":"output","groupLabel":"輸出與聚合","order":6,"source":"../src/lagrangian_backtracking/aggregate_release_payload.py","role":"保存跨 shard、scenario、事件與 pathway 的不可變彙整 payload","inputs":"AggregateSpec、AggregateShardBinding、ScenarioStratum、EventAggregateChunk 與 pathway aggregate","outputs":"AggregateReleasePayload；含 schema、run binding、拓撲、計數、分母與公尺／秒資料","entrypoints":["AggregateReleasePayload","AGGREGATE_RELEASE_SCHEMA_VERSION"],"read_first":"constructor 只封存已驗證的跨產品資料，不讀檔、不重算、不修補；成功建立仍只代表 條件式來源足跡／相對來源權重的工程資料容器。"},{"id":"aggregate_release_layout","title":"aggregate_release_layout.py","group":"output","groupLabel":"輸出與聚合","order":7,"source":"../src/lagrangian_backtracking/aggregate_release_layout.py","role":"定義 aggregate release 的固定檔名拓撲與唯讀編碼容器","inputs":"encoder 產生的固定 Parquet table rows 與 NumPy arrays","outputs":"九張表、十八個陣列的允許檔名集合與 EncodedAggregateProducts","entrypoints":["AGGREGATE_RELEASE_TABLE_FILES","AGGREGATE_RELEASE_ARRAY_FILES","EncodedAggregateProducts"],"read_first":"本模組只保證檔案集合與陣列封存，不驗證 shape、offset 或跨檔案語意；那些檢查必須 由 codec 完成，避免以檔名存在冒充產品完整性。"},{"id":"aggregate_release_codec","title":"aggregate_release_codec.py","group":"output","groupLabel":"輸出與聚合","order":8,"source":"../src/lagrangian_backtracking/aggregate_release_codec.py","role":"在記憶體中對 aggregate payload 做固定拓撲的表格／陣列編解碼","inputs":"AggregateReleasePayload、AggregateReleaseMetadata、AggregateSpec 與 encoded products","outputs":"九張固定欄位表、十八個陣列、metadata 與驗證後重建的 payload","entrypoints":["AggregateReleaseMetadata","encode_aggregate_release_payload","decode_aggregate_release_payload","metadata_from_payload"],"read_first":"先核對固定欄位順序、索引／offset、shape、dtype、排序與 round-trip；codec 不讀寫 Parquet／NPY、不解析 manifest，也不替缺資料猜值。"},{"id":"aggregate_pipeline","title":"aggregate_pipeline.py","group":"output","groupLabel":"輸出與聚合","order":9,"source":"../src/lagrangian_backtracking/aggregate_pipeline.py","role":"在 run gate 內逐 shard 建立 aggregate release payload 的單次串流管線","inputs":"完整且已驗證的 run、AggregateSpec、static input binding 與 trajectory shard iterator","outputs":"記憶體中的 AggregateReleasePayload，供 immutable release writer 使用","entrypoints":["build_aggregate_release_payload"],"read_first":"流程先驗證 source JSON、shard range 與 checksum，再把事件與 pathway reducer 逐批累加；不建立 partial/final 目錄、不寫 progress、不回讀 raw forcing，也不一次載入全部軌跡。"},{"id":"aggregate_release","title":"aggregate_release.py","group":"output","groupLabel":"輸出與聚合","order":10,"source":"../src/lagrangian_backtracking/aggregate_release.py","role":"建立、讀取與唯讀驗證 sibling immutable aggregate release","inputs":"已驗證 source run、原始 AggregateSpec、AggregateReleasePayload 與 destination parent","outputs":"固定 schema 1 release 目錄、aggregate manifest、checksum 與 JSON-safe validation summary","entrypoints":["write_aggregate_release","read_aggregate_release","validate_aggregate_release"],"read_first":"writer 只能在 sibling 目錄以 hidden partial 加 atomic rename 發布；manifest、普通檔案、表格／陣列、source snapshot 與 decoder 全部通過後才可交給報告層，既有 final 不覆寫。"},{"id":"report_spec","title":"report_spec.py","group":"output","groupLabel":"輸出與聚合","order":11,"source":"../src/lagrangian_backtracking/report_spec.py","role":"固定正式報告的頻寬、低樣本、代表軌跡與 renderer 規格","inputs":"已驗證 AggregateSpec、報告層研究參數與明示選樣／繪圖 policy","outputs":"immutable ReportSpec、aggregate spec hash binding 與可重建 JSON","entrypoints":["ReportSpec","load_report_spec","write_report_spec","validate_report_spec_against_aggregate_spec"],"read_first":"報告規格不得看過結果後臨時調整；公尺 bandwidth、秒制 age、4 × 2 representative strata 與低樣本遮罩都要在統計前固定並與 AggregateSpec 綁定。"},{"id":"report_records","title":"report_records.py","group":"output","groupLabel":"輸出與聚合","order":12,"source":"../src/lagrangian_backtracking/report_records.py","role":"保存報告圖表、表格、caption、sidecar 與 evidence 的 typed registry","inputs":"統計產品、來源 checksum、renderer metadata、F/T artifact identity 與 evidence policy","outputs":"ReportProductRef、ReportArtifactRecord、ReportRegistry 與固定 F01–F12／T01–T06 closure","entrypoints":["ReportProductRef","ReportArtifactRecord","ReportRegistry"],"read_first":"registry 只記錄可追溯產品與證據類別，不把 synthetic engineering evidence 冒充 SERVER scientific evidence，也不執行統計、繪圖或檔案讀寫。"},{"id":"report_ratio_statistics","title":"report_ratio_statistics.py","group":"output","groupLabel":"輸出與聚合","order":13,"source":"../src/lagrangian_backtracking/report_ratio_statistics.py","role":"將計數轉為帶狀態的比例與首次通過年齡分箱分位數","inputs":"已驗證非負 int64 計數、有效分母、秒制 age edges 與 histogram","outputs":"CountRatio、EstimateStatus 與 HistogramQuantileProduct；保留低樣本／零分母狀態","entrypoints":["CountRatio","build_count_ratio","HistogramQuantileProduct","build_histogram_quantiles"],"read_first":"零分母只能標記不可計算，不能改成 0；低樣本仍保留原始比例，age quantile 是固定分箱 中點近似，不是未分箱連續分布。"},{"id":"report_pathway_statistics","title":"report_pathway_statistics.py","group":"output","groupLabel":"輸出與聚合","order":14,"source":"../src/lagrangian_backtracking/report_pathway_statistics.py","role":"把 pathway 串流聚合轉成報告 renderer 可用的格網統計快照","inputs":"已驗證 StreamingPathwayAggregate、有效 member 分母與 ReportSpec policy","outputs":"PathwayGridStatistics；visit fraction、停留秒數、first-passage quantile 與低樣本遮罩","entrypoints":["PathwayGridStatistics","build_pathway_grid_statistics"],"read_first":"輸入 particle count 必須等於有效分母；(y_cell, x_cell) 軸與秒制時間守恆不可在報告層 轉置、補零或用 pooled strata fallback。"},{"id":"report_kde_statistics","title":"report_kde_statistics.py","group":"output","groupLabel":"輸出與聚合","order":15,"source":"../src/lagrangian_backtracking/report_kde_statistics.py","role":"建立三個公尺頻寬與 HDR 層級的 KDE 敏感度產品","inputs":"已驗證 AggregateSpec、ReportSpec 與 (y_cell, x_cell) 事件計數格網","outputs":"KDEBandwidthLayer、KDESensitivityProduct 與 zero／low-sample 狀態","entrypoints":["binned_gaussian_kde_2d","KDEBandwidthLayer","KDESensitivityProduct","build_kde_sensitivity_product"],"read_first":"KDE 只在原始樣本達門檻時建立；低樣本保留 raw count 但不製造假平滑，所有格網與 bandwidth 都在固定 local metric projection 的公尺座標中計算。"},{"id":"report_bootstrap","title":"report_bootstrap.py","group":"output","groupLabel":"輸出與聚合","order":16,"source":"../src/lagrangian_backtracking/report_bootstrap.py","role":"對 member-level 類別資料執行可重現的 exact nonparametric bootstrap","inputs":"固定順序的類別代碼／None、category count、replicate count、seed 與 confidence level","outputs":"CategoricalBootstrapIntervals、raw count、比例區間與 group seed digest","entrypoints":["derive_bootstrap_group_seed","CategoricalBootstrapIntervals","bootstrap_categorical_intervals"],"read_first":"None 是已知但未分類的 member，仍留在 bootstrap 分母；不能把缺值當成類別或對已加總 count 假設 Poisson。每個 group seed 由固定 identity 與 SHA-256 派生。"},{"id":"report_trajectory_identity","title":"report_trajectory_identity.py","group":"output","groupLabel":"輸出與聚合","order":17,"source":"../src/lagrangian_backtracking/report_trajectory_identity.py","role":"定義報告有效 member、四季／潮差分層與代表軌跡 identity digest","inputs":"ParticleResult、ParticleState、Observation 與 material／arrival／season／tide 欄位","outputs":"RepresentativeTrajectory、固定 policy、完整 identity 與 SHA-256 priority digest","entrypoints":["is_valid_report_member","representative_priority_digest","RepresentativeTrajectory"],"read_first":"DATA_GAP、NUMERICAL_FAILURE 與尚未終止的 ACTIVE 結果不得進入有效報告 member；identity 欄位、觀測順序與 UTC／公尺／秒單位均需保留，digest 不是來源機率。"},{"id":"report_trajectory_selection","title":"report_trajectory_selection.py","group":"output","groupLabel":"輸出與聚合","order":18,"source":"../src/lagrangian_backtracking/report_trajectory_selection.py","role":"按固定 SHA-256 priority 在八個核心 strata 保存代表軌跡","inputs":"ReportSpec、單一 ParticleResult、selection seed 與 study-site／season／tide strata","outputs":"RepresentativeSelection；每站 K 筆固定容量案例、eligible／排除計數與 selection digest","entrypoints":["RepresentativeSelection","RepresentativeTrajectorySelector"],"read_first":"每站 K 必須可被 8 整除，八層等額保留；selector 只保存目前入選案例，記憶體為 O(site × K)，不因候選粒子總數成長，也不以好看的案例取代可重建規則。"},{"id":"report_material_statistics","title":"report_material_statistics.py","group":"output","groupLabel":"輸出與聚合","order":19,"source":"../src/lagrangian_backtracking/report_material_statistics.py","role":"沉底漁業用具優先層的材質／底部接觸 member-level 統計","inputs":"Scenario／ScenarioStratum 分層索引與一次串流的 ParticleResult","outputs":"study_site_id × material_id 的有效分母、first bed contact／deposited member count 與 fraction","entrypoints":["MaterialStatistics","MaterialStatisticsProduct","MaterialStatisticsAccumulator","build_material_statistics"],"read_first":"正文優先層是 fishing gear × near_bed；此定性優先順序不改速度或來源先驗。 BED_CONTACT／DEPOSITED 以 member 去重，基線只報首次接觸／假設沉積，不含再懸浮或 repeated-contact 動力；其他材質與水層仍須保留。"},{"id":"report_matrix_statistics","title":"report_matrix_statistics.py","group":"output","groupLabel":"輸出與聚合","order":20,"source":"../src/lagrangian_backtracking/report_matrix_statistics.py","role":"建立停止結果與方向性跨站連通的不可變報告統計","inputs":"AggregateReleasePayload 中完整的停止狀態、source→target 跨站 raw count、total／valid member 分母與失敗網格","outputs":"OutcomeStatistics、ConnectivityStatistics；保留 raw count、兩種分母、比例狀態、方向性 site axis 與對角線不適用遮罩","entrypoints":["OutcomeStatistics","ConnectivityStatistics","build_outcome_statistics","build_connectivity_statistics"],"read_first":"跨站矩陣的列是來源站、欄是目標站；visit fraction 使用來源站有效 member 分母，event share 使用同一來源列的跨站事件分母。DATA_GAP／NUMERICAL_FAILURE 只留在停止與失敗曝光診斷，不得補零後混入條件式來源母體。"},{"id":"report_source_receptor_statistics","title":"report_source_receptor_statistics.py","group":"output","groupLabel":"輸出與聚合","order":21,"source":"../src/lagrangian_backtracking/report_source_receptor_statistics.py","role":"建立來源段—受體的條件式比例、事件占比與旅行年齡統計","inputs":"AggregateReleasePayload 的 source-receptor raw count、受體有效 member 分母、秒制旅行年齡 histogram 與 ReportSpec policy","outputs":"SourceReceptorStatistics、SourceReceptorStatistic 與 TravelAgeStatistics；保留 raw numerator／denominator、分箱中點分位數與不可用狀態","entrypoints":["SourceReceptorStatistics","SourceReceptorStatistic","TravelAgeStatistics","build_source_receptor_statistics"],"read_first":"條件式比例以同站同受體的有效 member 為分母，event share 則以同受體同邊界類別的事件總數為分母；兩者語意不同。旅行年齡軸固定為 (age_bin,) 秒制分箱，零分母或缺列不能用 0 取代，結果仍只代表條件式來源足跡／相對來源權重。"},{"id":"report_statistics","title":"report_statistics.py","group":"output","groupLabel":"輸出與聚合","order":22,"source":"../src/lagrangian_backtracking/report_statistics.py","role":"組合 renderer 可直接讀取的不可變報告統計 facade","inputs":"exact AggregateReleasePayload 與 ReportSpec，或已驗證的 matrix、source-receptor、pathway、KDE 與 material typed products","outputs":"ReportStatistics 與固定名稱的唯讀 products index","entrypoints":["ReportStatistics","build_report_statistics"],"read_first":"統一報告介面（facade）在綁定來源時，將核心及路徑產品與來源聚合資料逐欄核對，包含完整原始計數、分母、座標軸與規格政策；核密度估計（KDE）只依來源單次建立。材料與外部 KDE 只能走無執行批次身分的純產品（pure-products）入口。不從軌跡重算、不接受繪圖端臨時更改分母、分位數或平滑帶寬，也不負責繪圖、附屬說明檔、成果檔寫入或報告發布。"},{"id":"report_comparison_statistics","title":"report_comparison_statistics.py","group":"output","groupLabel":"輸出與聚合","order":23,"source":"../src/lagrangian_backtracking/report_comparison_statistics.py","role":"F11/T05 exact compatibility 與核心差值的純計算產品","inputs":"兩份各自帶有 AggregateReleasePayload／ReportSpec 的 ReportStatistics，以及 caller 明示的單一物理參數差異","outputs":"ReportComparisonStatistics；outcome、connectivity、source-receptor、pathway、HDR 差值；材質（material）來源核對尚未完成，目前不提供材質差值","entrypoints":["ComparisonHDRStatus","ComparisonParameterDifference","ComparisonRatioDifference","ComparisonScalarDifference","ReportComparisonStatistics","build_report_comparison_statistics"],"read_first":"先核對 run、site／scenario／receptor／arrival／material、geometry、age／KDE／pathway 軸與報告政策的 exact compatibility，再計算 comparison 減 baseline；zero／unavailable 不補 0。F11/T05 的 exact compatibility 與核心差值純計算已完成；比較只接受來源綁定的統計介面，材質的逐粒子來源核對尚未完成，因此目前不提供材質差值，不能宣稱全部差值可用。comparison release I/O、artifact adapter、pipeline/render 整合與真實 sensitivity cases 尚未完成，不能稱 F11/T05 科學成果完成。"},{"id":"report_pipeline","title":"report_pipeline.py","group":"output","groupLabel":"輸出與聚合","order":24,"source":"../src/lagrangian_backtracking/report_pipeline.py","role":"report_pipeline.py 建置前唯讀 gate 已完成；完整 report pipeline 尚未完成","inputs":"complete run、aggregate release／AggregateSpec、ReportSpec、MPLCONFIGDIR、固定 output 與可選 comparison／validation evidence","outputs":"immutable ReportBuildPreflight；保存 typed identity、schema、SHA-256、flags 與絕對 Path，不建立 JSON、圖表、staging 或 final report","entrypoints":["ReportBuildPreflight","preflight_report_build"],"read_first":"建置前唯讀 gate 已完成：會檢查 complete run、aggregate/spec binding、formal trajectory v2、MPLCONFIGDIR、output/evidence policy 與固定 output；不讀 raw NetCDF、不產生圖表、不建立 partial。build_report_release、F01–F12/T01–T06 專屬 artifact adapters、CLI report-build 與正式 SERVER 科學發布仍未完成，不能把 preflight 稱為完整 pipeline。comparison aggregate 的精確 compatibility matrix 仍由 report_comparison_statistics 負責。"},{"id":"report_trajectory_stream","title":"report_trajectory_stream.py","group":"output","groupLabel":"輸出與聚合","order":25,"source":"../src/lagrangian_backtracking/report_trajectory_stream.py","role":"以一次 bounded trajectory stream 同步建立有效 pathway、環境、材質與代表軌跡 products","inputs":"已驗證 ParticleResult shard iterator、AggregateSpec、ReportSpec 與完整 ScenarioStratum identity index","outputs":"TrajectoryStreamStatistics；包含 EnvironmentCompletenessStatistics、材質統計、有效 pathway 與固定容量 representative selection","entrypoints":["EnvironmentCompletenessSiteStatistics","EnvironmentCompletenessStatistics","EnvironmentCompletenessAccumulator","build_environment_completeness_statistics","TrajectoryStreamStatistics","TrajectoryReportAccumulator","build_trajectory_stream_statistics"],"read_first":"完整 shard 依 immutable run plan 順序交給 add_shard；只把有效 member 送入 pathway，DATA_GAP／NUMERICAL_FAILURE 不得補零或混入有效分母。此模組只保存 bounded typed products，不代表 renderer、完整 report pipeline 或正式科學成果已完成。"},{"id":"report_release","title":"report_release.py","group":"output","groupLabel":"輸出與聚合","order":26,"source":"../src/lagrangian_backtracking/report_release.py","role":"report-v1 source binding、fixed topology 與 atomic writer／reader／validator","inputs":"caller 明示的 ReportRegistry、aggregate／run／spec source snapshot 與已產生的普通 figure、table、caption、data sidecar files","outputs":"同父 sibling 的 immutable report-v1 release、exact manifest／checksum 與固定 JSON-safe validation report","entrypoints":["ReportRelease","ReportReleaseWriter","read_report_registry","read_report_release","validate_report_release","write_report_release"],"read_first":"writer 只封裝 caller 已建立的 products，先完成 source binding、registry closure、exact inventory 與 self-validation 才 atomic rename；reader／validator 唯讀且不追隨 symlink。report_pipeline.py 的建置前唯讀 gate 已完成，但 build_report_release、F01–F12/T01–T06 專屬 ar       svg.setAttribute("viewBox", `0 0 ${mapWidth} ${mapHeight}`);
      svg.style.setProperty("--map-width", `${mapWidth}px`);
      svg.style.aspectRatio = `${mapWidth} / ${mapHeight}`;
      return {groupWidth, groupHeight, mapWidth, mapHeight, groupX};
    }

    function createSvgElement(tag, attributes = {}) {
      const element = document.createElementNS(svgNS, tag);
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }

    function textElement(tag, text, attributes = {}) {
      const element = createSvgElement(tag, attributes);
      element.textContent = text;
      return element;
    }

    function layout() {
      layoutMetrics = calculateLayoutMetrics();
      groups.forEach(group => {
        group.modules.forEach((moduleId, index) => {
          const x = layoutMetrics.groupX.get(group.id) + groupPaddingX;
          const y = groupTop + groupHeaderHeight + index * (nodeHeight + rowGap);
          positions.set(moduleId, {x, y, cx: x + nodeWidth / 2, cy: y + nodeHeight / 2});
        });
      });
    }

    function curvePath(sourceId, targetId) {
      const source = positions.get(sourceId);
      const target = positions.get(targetId);
      if (!source || !target) return "";
      const direction = target.cx >= source.cx ? 1 : -1;
      const startX = source.cx + direction * (nodeWidth / 2 - 4);
      const endX = target.cx - direction * (nodeWidth / 2 - 4);
      const bend = Math.max(45, Math.abs(endX - startX) * 0.33);
      return `M ${startX} ${source.cy} C ${startX + direction * bend} ${source.cy}, ${endX - direction * bend} ${target.cy}, ${endX} ${target.cy}`;
    }

    function drawGroups() {
      const layer = document.getElementById("group-layer");
      layer.replaceChildren();
      groups.forEach(group => {
        const x = layoutMetrics.groupX.get(group.id);
        const panel = createSvgElement("rect", {
          x,
          y: groupTop,
          width: layoutMetrics.groupWidth,
          height: layoutMetrics.groupHeight,
          rx: 15,
          class: "group-panel",
          stroke: group.color,
        });
        layer.appendChild(panel);
        layer.appendChild(textElement("text", group.label, {
          x: x + groupPaddingX,
          y: groupTop + 27,
          class: "group-title",
          fill: group.color,
        }));
        layer.appendChild(textElement("text", group.description, {
          x: x + groupPaddingX,
          y: groupTop + 48,
          class: "group-description",
        }));
      });
    }

    function drawEdges() {
      const layer = document.getElementById("edge-layer");
      layer.replaceChildren();
      allEdges.forEach((edge, index) => {
        const visible = edge.type === "import" ? state.showImports : state.showFlow;
        const path = createSvgElement("path", {
          d: curvePath(edge.source, edge.target),
          class: `edge ${edge.type}`,
          "data-edge-index": index,
          "data-source": edge.source,
          "data-target": edge.target,
          "marker-end": `url(#${edge.type}-arrow)`,
        });
        if (!visible) path.style.display = "none";
        layer.appendChild(path);
        if (edge.type === "flow") {
          const source = positions.get(edge.source);
          const target = positions.get(edge.target);
          if (source && target) {
            const label = textElement("text", edge.label, {x: (source.cx + target.cx) / 2, y: (source.cy + target.cy) / 2 - 4, class: "edge-label", "data-edge-index": index});
            if (!visible) label.style.display = "none";
            layer.appendChild(label);
          }
        }
      });
    }

    function drawNodes() {
      const layer = document.getElementById("node-layer");
      layer.replaceChildren();
      modules.forEach(module => {
        const pos = positions.get(module.id);
        const moduleGroup = groups.find(item => item.id === module.group);
        const group = createSvgElement("g", {class: "node", tabindex: "0", role: "button", "aria-label": `${module.title}：${module.role}`, "data-module-id": module.id});
        group.appendChild(createSvgElement("rect", {x: pos.x, y: pos.y, width: nodeWidth, height: nodeHeight, rx: 9, stroke: moduleGroup ? moduleGroup.color : "#94a3b8"}));
        group.appendChild(textElement("text", module.title, {x: pos.x + 14, y: pos.y + 23, class: "node-title"}));
        group.appendChild(textElement("text", module.role, {x: pos.x + 14, y: pos.y + 43, class: "node-role"}));
        group.appendChild(textElement("text", `src/lagrangian_backtracking/${module.id}.py`, {x: pos.x + 14, y: pos.y + 58, class: "node-file"}));
        group.addEventListener("click", () => selectModule(module.id));
        group.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectModule(module.id); } });
        layer.appendChild(group);
      });
    }

    function moduleSummary(moduleId) {
      const module = moduleById.get(moduleId);
      if (!module) return `${moduleId}：模組資料缺失（連線已保留）`;
      return `${module.title}：${module.role}`;
    }

    function moduleTitle(moduleId) {
      const module = moduleById.get(moduleId);
      return module ? module.title : `${moduleId}（未知模組）`;
    }

    function moduleSearchText(module) {
      // 搜尋索引明確納入可選的 BayTrace 整合說明，讓使用者搜尋外部方法名稱時，
      // 能找到有實際整合關係的模組，而沒有該欄位的模組仍可正常搜尋。
      return [
        module.id,
        module.title,
        module.role,
        module.entrypoints.join(" "),
        module.baytrace_integration || "",
      ].join(" ").toLowerCase();
    }

    function relatedIds(moduleId) {
      const related = new Set([moduleId]);
      allEdges.forEach(edge => {
        if ((edge.source === moduleId || edge.target === moduleId) && (edge.type === "import" ? state.showImports : state.showFlow)) {
          related.add(edge.source);
          related.add(edge.target);
        }
      });
      return related;
    }

    function applyVisualState() {
      const query = state.query.trim().toLowerCase();
      const related = relatedIds(state.selected);
      document.querySelectorAll(".node").forEach(node => {
        const id = node.dataset.moduleId;
        const module = moduleById.get(id);
        const matches = !query || moduleSearchText(module).includes(query);
        node.classList.toggle("is-selected", id === state.selected);
        node.classList.toggle("is-related", !query && id !== state.selected && related.has(id));
        // 有搜尋文字時以搜尋結果為主；沒有搜尋文字時才以選取模組的鄰居為主，避免
        // 使用者搜尋 forcing 時，因為目前選取 runner 而把 forcing 一起淡化。
        node.classList.toggle("is-dim", query ? !matches : Boolean(state.selected) && !related.has(id));
      });
      document.querySelectorAll(".edge, .edge-label").forEach(element => {
        const index = Number(element.dataset.edgeIndex);
        const edge = allEdges[index];
        const visible = edge.type === "import" ? state.showImports : state.showFlow;
        const highlighted = edge.source === state.selected || edge.target === state.selected;
        element.classList.toggle("is-highlight", highlighted && visible);
        element.classList.toggle("is-dim", Boolean(state.selected) && !highlighted);
        if (edge.type === "import") element.style.display = state.showImports ? "" : "none";
        if (edge.type === "flow") element.style.display = state.showFlow ? "" : "none";
      });
    }

    function listHtml(items, emptyText) {
      if (!items.length) return `<p>${emptyText}</p>`;
      return `<ul>${items.map(item => `<li><code>${item}</code></li>`).join("")}</ul>`;
    }

    function selectModule(moduleId) {
      const panel = document.getElementById("detail-panel");
      // 即使未來手工資料或快取帶入未知 endpoint，也先以 runtime（或首個模組）
      // 作為安全選取，不讓詳細面板因未定義端點的屬性存取中斷整頁互動。
      const module = moduleById.get(moduleId) || moduleById.get("runtime") || modules[0];
      if (!module) {
        panel.textContent = "目前沒有可顯示的模組資料。";
        return;
      }
      state.selected = module.id;
      const imports = importEdges
        .filter(edge => edge.source === module.id)
        .map(edge => moduleSummary(edge.target));
      const importedBy = importEdges
        .filter(edge => edge.target === module.id)
        .map(edge => moduleSummary(edge.source));
      const flowOut = flowEdges
        .filter(edge => edge.source === module.id)
        .map(edge => `${edge.label} → ${moduleTitle(edge.target)}`);
      const flowIn = flowEdges
        .filter(edge => edge.target === module.id)
        .map(edge => `${moduleTitle(edge.source)} → ${edge.label}`);
      panel.innerHTML = `
        <div class="detail-kicker">${module.groupLabel}</div>
        <h2>${module.title}</h2>
        <p class="detail-role">${module.role}</p>
        <p class="status">已選取：${module.title}；圖上已高亮直接關聯節點。</p>
        <section class="detail-section"><h3>主要閱讀入口</h3>${listHtml(module.entrypoints, "此模組沒有列出的公開入口。")}</section>
        <section class="detail-section"><h3>輸入</h3><p>${module.inputs}</p></section>
        <section class="detail-section"><h3>輸出／責任</h3><p>${module.outputs}</p></section>
        <section class="detail-section"><h3>它實際引用的模組</h3>${listHtml(imports, "沒有相對匯入；可能是資料型別、數值核心或入口模組。")}</section>
        <section class="detail-section"><h3>引用它的模組</h3>${listHtml(importedBy, "目前沒有其他 src 模組直接相對匯入它。")}</section>
        <section class="detail-section"><h3>文件化流程：輸入 → 它</h3>${listHtml(flowIn, "沒有登錄的上游流程連線。")}</section>
        <section class="detail-section"><h3>文件化流程：它 → 輸出</h3>${listHtml(flowOut, "沒有登錄的下游流程連線。")}</section>
        <section class="detail-section"><h3>接手時先問</h3><p>${module.read_first}</p></section>
        ${module.baytrace_integration ? `<section class="detail-section"><h3>BayTrace 整合關係</h3><p>${module.baytrace_integration}</p></section>` : ""}
        <a class="code-link" href="${module.source}">開啟 ${module.title} 原始碼 ↗</a>
      `;
      applyVisualState();
    }

    function searchModules(value) {
      state.query = value;
      applyVisualState();
    }

    layout();
    drawGroups();
    drawEdges();
    drawNodes();
    selectModule(state.selected);
    document.getElementById("module-search").addEventListener("input", event => searchModules(event.target.value));
    document.getElementById("show-imports").addEventListener("change", event => { state.showImports = event.target.checked; drawEdges(); applyVisualState(); });
    document.getElementById("show-flow").addEventListener("change", event => { state.showFlow = event.target.checked; drawEdges(); applyVisualState(); });
    document.getElementById("reset-selection").addEventListener("click", () => { document.getElementById("module-search").value = ""; state.query = ""; selectModule("runtime"); });
  </script>
</body>
</html>
