  - study_site_id: lienchiang
    study_site_name_zh: 連江
    analysis_region_id: D
    flow_domain_id: lienchiang_common_cache_v3
    # D 區先以 flow-domain 中心作為明示受體 anchor，再以 12.5 km 公尺制核心限制
    # 水平候選。實際 receptor 仍須通過 static/persistent wet 與逐時垂向支援 gate。
    anchor_lonlat: [119.95, 26.2]
    receptor_core_radius_m: 12500
    anchor_policy: flow_domain_center_snap_to_persistent_wet_mesh
    local_domain_policy: same_as_flow_domain

geometry:
  # 幾何生成規則已決定；null 表示尚未以 SERVER OCM mesh 實際產出與驗證 polygon/受體。
  domain_manifest: null
  local_domain_manifest: null
  # 需保存 local/flow polygon exterior 中的 open-water 線段；其餘邊界才可分類為海岸。
  open_boundary_manifest: null
  receptor_manifest: null
  reporting_region_manifest: null
  geometry_decision_status: decided_generation_pending_server_mesh
  reject_invalid_geometry: true
  coordinate_round_trip_tolerance_m: 0.05

forcing:
  ocm:
    horizontal_mesh: native_schism_faces
    quad_split_policy: deterministic_quality_diagonal
    horizontal_interpolation: barycentric_require_all_vertices
    vertical_interpolation: linear_bracketing_finite_zcor_no_extrapolation
    time_interpolation: linear_no_extrapolation
    z_coordinate: m_positive_up
    hvel_unit: m_per_s
    vertical_velocity_unit: m_per_s
    diffusivity_unit: m2_per_s
    wetdry_semantics_decision_status: derived_pending_server_preflight

  nww3:
    horizontal_interpolation: mask_aware_bilinear_require_all_corners
    time_interpolation: linear_no_extrapolation
    peak_period_source: reciprocal_of_peak_frequency
    direction_convention: wave_from_north_clockwise
    propagation_conversion: add_180_degrees
    # WAVEWATCH III legacy 定義與山陀兒、康芮兩個獨立事件已形成研究端採用契約；
    # 供應者不可考不影響此版本化決策，日後只有反證才另立新版。
    convention_evidence_status: approved
    convention_contract_id: nww3_dp_wnd_two_typhoon_adopted_v1

physics:
  # 本工項以完全沉沒物體為基線，因此不加入 windage。
  include_windage: false

  stokes:
    enabled: true
    formulation: finite_depth_monochromatic_bulk
    wave_height_source: significant_wave_height
    period_source: peak_frequency
    direction_source: peak_direction_raw_deg
    dispersion_relation: omega_squared_equals_gk_tanh_kh
    gravity_mps2: 9.80665
    # 完整逐時 analysis 產製後，這裡只處理空間必要欄位、manifest/checksum/I/O 或局部
    # 取樣失敗；不能把舊 target-time 缺口留到 runtime 當作正常終止。
    invalid_wave_policy: stop_with_wave_data_gap
    required_sensitivity_cases:
      - no_stokes
      - deep_water_bulk
      - finite_depth_bulk

  settling:
    # iOcean 網頁只提供清除統計所用的十個分類名稱，未提供單體密度、尺寸、形狀因子、
    # 阻力係數或終端速度。本表將官方分類與代表材質／形狀條件對接，但十個負值速度只
    # 是涵蓋 10^-4–10^-1 m/s 的敏感度格點，不得宣稱為官方量測或類別平均物性。
    # 對保麗龍、木材與中空瓶罐，只納入吸水、附著或進水後已完全沉沒且向下運動者；
    # 未符合條件的物件必須排除，不能為了湊足十類而強制賦予負值。
    material_manifest: null
    expected_material_count: 10
    z_positive_up_sign_convention: true
    require_strictly_negative_velocity: true
    positive_or_zero_velocity_policy: reject_config
    velocity_unit: m_per_s
    classification_source: oca_iocean_marine_litter_categories_accessed_2026_08_27
    velocity_source: design_sensitivity_grid_not_oca_measurement
    design_decision_status: decided_material_shape_proxies_pending_calibration
    material_classes:
      - material_id: oca_styrofoam_porous_fragment
        oca_category_zh: 保麗龍
        material_family_zh: 發泡聚苯乙烯（EPS）
        representative_shape_zh: 吸水或生物附著之多孔不規則碎塊
        settling_velocity_mps: -0.0001
        behavior_class: sinking
        applicability_condition_zh: 限已吸水或生物附著、整體仍完全沉沒且呈負浮力者
        calibration_status: provisional_proxy
        evidence_grade: C_conditional_biofouling_mechanism
      - material_id: oca_wood_waterlogged_elongated
        oca_category_zh: 竹木
        material_family_zh: 竹材或木材
        representative_shape_zh: 水浸飽和之細長枝條或片狀木屑
        settling_velocity_mps: -0.0002
        behavior_class: sinking
        applicability_condition_zh: 限水浸後整體密度已高於周圍海水者
        calibration_status: provisional_proxy
        evidence_grade: D_no_transferable_item_velocity
      - material_id: oca_wastepaper_folded_fiber
        oca_category_zh: 廢紙
        material_family_zh: 吸水纖維材料
