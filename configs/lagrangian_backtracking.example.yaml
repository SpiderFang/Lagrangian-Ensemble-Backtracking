        settling_velocity_mps: -0.050
        behavior_class: sinking
        applicability_condition_zh: 姿態、開口、塗層與腐蝕效應尚未顯式解析
        calibration_status: provisional_proxy
        evidence_grade: B_material_order_D_can_velocity
      - material_id: oca_glass_bottle_or_fragment
        oca_category_zh: 玻璃瓶
        material_family_zh: 玻璃
