  boundary_density: one_dimensional_arclength_primary
  map_kde: two_dimensional_gaussian_compatibility_product
  bandwidth_policy: three_scale_sensitivity
  hdr_levels: [0.50, 0.75, 0.90]
  bootstrap_strata:
