# 本檔固定 design_baseline_v3_non_rising_a_v3_local20_observation_2025_gap_censored_20260916 的科學與工程規則，但仍不是
# 可直接送入正式批次的 release config。v3 依研究主持人意見保留 A 區 v3 forcing source，
# 將貢寮與龜山島 local domain 定為 20 km、receptor core 定為 12.5 km，並將本期 A 區
# 35 km／南擴 sensitivity 排除在研究範圍外；十個嚴格負值沉降格點仍指定 iOcean 分類、
# 代表材質、形狀、適用條件及證據等級。
# local-domain polygon、受體座標、50 個 UTC、M、擴散係數與 SERVER 路徑必須依已決定的
# 演算法由實際網格、forcing 與先導試驗衍生；null 表示「尚未產出衍生 manifest」，不是
# 等待研究人員任意選值。正式批次只接受所有 derived gate 均通過的 approved release config。
schema_version: "0.4.0"
config_status: design_pending
design_version: design_baseline_v3_non_rising_a_v3_local20_observation_2025_gap_censored_20260916
project_id: lagrangian_ensemble_backtracking
time_standard: UTC

inputs:
  # 路徑由環境變數注入；程式不得把本機或 SERVER 絕對路徑寫死在原始碼。
  ocm_native_root_env: OCM_NATIVE_ROOT
  ocm_surface_root_env: OCM_SURFACE_ROOT
  nww_analysis_root_env: NWW_ANALYSIS_ROOT
  years: [2024, 2025]
  # H90 加最長 90 日沉底年齡需要 180 日 observation 選時包絡；設定值本身不是資料證據。
  # 新版只在 2025 選 observation anchor，因此最早時次往前 180 日約落在 2024-07-05。
  # 本範例仍為 design_pending：180 日只界定要列舉的最大 observation 包絡，不要求
  # 包絡內連續無缺時；strict input-build 會核對起點可用性並保存第一缺口截尾證據，
  # 不可補值，也不可把 2024 誤列為 observation strata。
  backtrack_support_days: 180

  # 研究團隊已裁決：現有 OCM/NWW 是可取得的全部正式資料，供應者不可考，不能把
  # provider 補件或 metadata 確認列為 blocker。正式成果名稱必須寫成「2024–2025
  # 全部可得資料」，並完整揭露 observed/reconstructed coverage。
  available_data_contract:
    status: decided
    population_id: available_2024_2025_forcing_2025_observation_v1
    interpretation: complete_formal_result_over_all_available_samples
    provider_followup_required: false
    unknown_provider_metadata_policy: preserve_unknown_and_use_versioned_project_contract
    do_not_claim: provider_confirmed_best_forecast_cycle

  # OCM-SVD-Analysis 已採相同的跨月 stable-sort/prefer-last 去重。已知 OCM 缺口
  # 無法補齊時，正式母體完整保留可得資料；粒子回溯遇到第一個缺口即以 data_gap
  # 截尾。此政策不做最近值、零值或外插，且不宣稱連續完整軌跡。
  time_axis_contract:
    canonicalization_policy: sort_and_deduplicate_prefer_last
    expected_timestep_hours: 1.0
    short_gap_missing_steps: 1
    short_gap_candidate_method: component_linear_interpolation
    long_gap_candidate_method: multivariate_eof_harmonic_state_space_bidirectional_smoother
    pure_dineof_for_whole_missing_snapshot_allowed: false
    validation: blocked_mask_actual_gap_shapes_plus_eulerian_and_lagrangian_skill
    baseline_fallback: gap_safe_stratified_arrival_windows
    preserve_origin_labels: [observed, reconstructed_short, reconstructed_state_space]
    gap_policy: observed_gap_censored_stop_at_first_gap_v1
    stop_at_first_gap: true
    denominator_policy: exclude_data_gap_numerical_failure_and_pre_window_deposition_v1
  # OCM 兩種時間支撐擇一，加上 NWW 完整逐時 manifest，均由 SERVER 實值驗證產生；
  # null 是實作 gate，不是等待外部資料。
  ocm_gap_reconstruction_manifest: null
  # 保存每個 arrival／沉底起點的 exact available hour、缺口清單與第一缺口截尾
  # evidence；它不宣稱長窗連續，也不允許以最近值、零值或外插跨越缺口。
  ocm_gap_safe_arrival_manifest: null
  nww_full_hourly_analysis_manifest: null

  ocm_contract:
    required_schema_major: 3
    accepted_statuses: [ready]
    # partial month 是全部可得資料母體的一部分；缺日不能改名為完整月，但也不再等待補件。
    accepted_cache_kinds: [standard_month, standard_partial_month]
    required_month_arrays:
      - time_utc_ns.npy
      - hvel.npy
      - vertical_velocity.npy
      - zcor.npy
      - elev.npy
      - wetdry_elem.npy
      - diffusivity.npy
    required_grid_arrays:
      - source_lon.npy
      - source_lat.npy
      - source_face_nodes_local.npy
      - source_face_node_count.npy
      - source_depth_m.npy
      - source_node_bottom_index.npy
      - source_face_global_index.npy

  nww_contract:
    required_schema_major: 1
    # trial_ready 僅表示 lexical cycle selection 不宣稱最佳 forecast lead；在供應者不可考
    # 的前提下，研究端以固定選取與 audit 契約正式採用，不再要求改寫上游 status。
    accepted_statuses: [ready, trial_ready]
    # 第二個名稱是目前 SERVER metadata 的 accepted cache kind：先使用完整可取得的
    # NWW archive native hourly time axis，再重格網至 OCM spatial grid；它不代表供應者
    # 的 best-cycle 或最佳 forecast lead。保留舊名稱以相容既有已驗收產品與 release binding。
    accepted_cache_kinds:
      - ocm_analysis_grid_resample_from_nww3_native
      - ocm_spatial_grid_resample_from_complete_available_nww3_archive_native_time_v1
    required_arrays:
      - time_utc_ns.npy
      - significant_wave_height.npy
      - peak_frequency.npy
      - peak_direction_raw_deg.npy
      - valid_mask_wave.npy
      - qc_flags.npy
    # 1.5 小時只限制完整逐時產品內的 RK stage 線性內插。SERVER nww3_native 已有
    # 2024-01-01 00:00 至 2025-12-31 23:00 共 17,544 個連續逐時 UTC；analysis 將以
    # 靜態 OCM grid 重建完整時間軸，不沿用 gappy OCM target times。
    maximum_time_gap_hours: 1.5
    source_native_time_coverage: complete_17544_hourly_steps
    analysis_time_support_policy: superset_of_ocm_observed_and_reconstructed_times

study_area:
  # A-D 是四個 forcing flow domains；正式情境與成果的第一層單元則是五個 study sites。
  # 貢寮與龜山島共用 A 區 forcing，但 receptor、scenario、seed、event 與 aggregate 必須分開。
  expected_flow_domain_count: 4
  expected_analysis_region_count: 4
  expected_study_site_count: 5
  primary_analysis_unit: study_site
  secondary_aggregation_unit: analysis_region
  # 兩個 anchor-centered local domains 可反映相連水動力環境而互相重疊；不得為了
  # 強迫互斥而以任意 Voronoi 或緯度線切割，亦不得在聚合時把重疊區自動扣除。
  allow_overlapping_local_domains: true
  # 貢寮與龜山島的水動力互通由同一 A 區 forcing 表達。每條軌跡仍只以自己的
  # local domain 定義主要入口；穿越另一站 local domain 只寫非終止診斷事件，
  # 不改變 study_site_id、scenario 歸屬、停止條件或主要統計分母。
  shared_forcing_domain_preserves_hydrodynamic_connectivity: true
  primary_local_boundary_scope: own_study_site_only
  other_site_local_domain_crossing_policy: record_nonterminating_diagnostic_only

domains:
  # 四列只定義 forcing 支撐、metric CRS 與外層停止邊界；情境數由下方五個
  # study_sites 決定。bbox/center 沿用 OCM-Data-Preprocessing flow-domain v3。
  - analysis_region_id: A
    analysis_region_name_zh: 東北角海域
    flow_domain_id: northeast_taiwan_common_cache_v3
    center_lonlat: [122.05, 25.05]
    bbox_lon_lat: [121.306315, 122.793685, 24.600844, 25.499156]
    metric_crs_policy: local_azimuthal_equidistant
    # 本期 A 區固定使用 OCM-Data-Preprocessing flow-domain v3 與兩站 20 km local。
    # 三套 forcing 的空間支援不宣稱有預先量測的共同 margin；正式 runtime 必須在每個
    # 速度取樣階段確認 forcing 有效，無效即 fail closed 並依停止型邊界政策終止該粒子。
    formal_domain_policy: v3_local20km_20260909_v1
    current_domain_role: development_and_pilot
    formal_release_flow_domain_id: northeast_taiwan_common_cache_v3
    formal_release_domain_status: no_expansion_runtime_stage_fail_closed
    runtime_spatial_support_policy: runtime_stage_fail_closed_no_expansion_v1
  - analysis_region_id: B
    analysis_region_name_zh: 新竹外海
    flow_domain_id: hsinchu_cache_v3
    center_lonlat: [120.45, 24.75]
    bbox_lon_lat: [119.70812, 121.19188, 24.300844, 25.199156]
    metric_crs_policy: local_azimuthal_equidistant
  - analysis_region_id: C
    analysis_region_name_zh: 後灣海域
    flow_domain_id: houwan_nmmba_cache_v3
    center_lonlat: [120.893355, 22.0]
    bbox_lon_lat: [120.16671, 121.62, 21.550844, 22.449156]
    metric_crs_policy: local_azimuthal_equidistant
  - analysis_region_id: D
    analysis_region_name_zh: 連江海域
    flow_domain_id: lienchiang_common_cache_v3
    center_lonlat: [119.95, 26.2]
    bbox_lon_lat: [119.19912, 120.70088, 25.750844, 26.649156]
    metric_crs_policy: local_azimuthal_equidistant

study_sites:
  # 貢寮與龜山島不沿用過小的 surface-SVD candidate bbox。兩站均以 anchor 為中心，
  # 在 Azimuthal Equidistant CRS 產生半徑 12.5 km 受體核心與 20 km local domain，
  # 再與 A 區固定 OCM ocean polygon 相交。動態 wet/dry 只篩受體與 forcing stage，
  # 不得使 boundary 隨 arrival time 改變；本期 A 區不登錄 35 km sensitivity。各站的
  # minimum_flow_domain_margin_local_grid_scales 是受體候選與外層幾何邊界的安全距離，
  # 不代表 OCM/NWW 三套 forcing 的共同網格 margin 已量測。
  - study_site_id: gongliao
    study_site_name_zh: 貢寮
    analysis_region_id: A
    flow_domain_id: northeast_taiwan_common_cache_v3
    formal_release_flow_domain_id: northeast_taiwan_common_cache_v3
    anchor_lonlat: [121.92807, 25.11245]
    receptor_core_radius_m: 12500
    local_domain_baseline_radius_m: 20000
    local_domain_sensitivity_radii_m: []
    minimum_flow_domain_margin_local_grid_scales: 2
    geometry_generator: anchor_centered_azimuthal_equidistant_buffer_intersect_static_ocm_ocean_polygon
    local_domain_overlap_policy: allowed_preserve_site_identity
    legacy_candidate_bbox_lon_lat_provenance_only: [121.91, 122.06, 25.00, 25.15]
  - study_site_id: guishan
    study_site_name_zh: 龜山島西側
    analysis_region_id: A
    flow_domain_id: northeast_taiwan_common_cache_v3
    formal_release_flow_domain_id: northeast_taiwan_common_cache_v3
    anchor_lonlat: [121.951606, 24.843127]
    receptor_core_radius_m: 12500
    local_domain_baseline_radius_m: 20000
    local_domain_sensitivity_radii_m: []
    minimum_flow_domain_margin_local_grid_scales: 2
    geometry_generator: anchor_centered_azimuthal_equidistant_buffer_intersect_static_ocm_ocean_polygon
    local_domain_overlap_policy: allowed_preserve_site_identity
    legacy_candidate_bbox_lon_lat_provenance_only: [121.81, 121.97, 24.76, 24.92]
  - study_site_id: hsinchu
    study_site_name_zh: 新竹外海
    analysis_region_id: B
    flow_domain_id: hsinchu_cache_v3
    # 受體核心中心沿用 B 區已登錄 flow-domain 中心；這兩個欄位只限制水平受體候選，
    # 不改變 B 區 flow domain，也不把 local domain 從 flow domain 縮成 12.5 km 圓。
    anchor_lonlat: [120.45, 24.75]
    receptor_core_radius_m: 12500
    anchor_policy: flow_domain_center_snap_to_persistent_wet_mesh
    local_domain_policy: same_as_flow_domain
  - study_site_id: houwan
    study_site_name_zh: 後灣海生館
    analysis_region_id: C
    flow_domain_id: houwan_nmmba_cache_v3
    # C 區受體 anchor 與 12.5 km core 是位置候選的初始範圍；紅框子區另以兩個
    # receptor_candidate_regions 明示西岸／南端配額。紅框只限制受體選點，不能取代
    # OCM static ocean、persistent wet/dry、NWW 四角或垂向 zcor 支援檢查。
    anchor_lonlat: [120.893355, 22.0]
    receptor_core_radius_m: 12500
    anchor_policy: flow_domain_center_snap_to_persistent_wet_mesh
    local_domain_policy: same_as_flow_domain
    receptor_candidate_selection:
      policy_id: houwan_red_frame_two_subregions_anchor_first_maximin_2plus3_v1
      require_each_region: true
      total_horizontal_count: 5
      distance_coordinate_system: local_azimuthal_equidistant_m
      boundary_policy: approved_C_flow_local_intersection_plus_persistent_wet_margin
    # 座標由研究者提供的 overview 手繪紅框數位化而來；影像 hash 與像素範圍讓
    # polygon 可以由同一附件重建。這是候選區 provenance，不是 forcing 支援證據。
    receptor_candidate_regions_provenance:
      source_artifact: horizontal_overview.png
      source_sha256: 0c28a19f9707f5d4717799b4936bb99195a868b76aec1322c21c725192132beb
