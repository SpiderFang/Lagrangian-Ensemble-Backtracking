# 本檔固定 design_baseline_v1 的科學與工程規則，但仍不是可直接送入正式批次的 release config。
# local-domain polygon、受體座標、50 個 UTC、M、擴散係數與 SERVER 路徑必須依已決定的
# 演算法由實際網格、forcing 與先導試驗衍生；null 表示「尚未產出衍生 manifest」，不是
# 等待研究人員任意選值。正式批次只接受所有 derived gate 均通過的 approved release config。
schema_version: "0.3.0"
config_status: design_baseline_example
design_version: design_baseline_v1
project_id: lagrangian_ensemble_backtracking
time_standard: UTC

inputs:
  # 路徑由環境變數注入；程式不得把本機或 SERVER 絕對路徑寫死在原始碼。
  ocm_native_root_env: OCM_NATIVE_ROOT
  ocm_surface_root_env: OCM_SURFACE_ROOT
  nww_analysis_root_env: NWW_ANALYSIS_ROOT
  years: [2024, 2025]

  # 研究團隊已裁決：現有 OCM/NWW 是可取得的全部正式資料，供應者不可考，不能把
  # provider 補件或 metadata 確認列為 blocker。正式成果名稱必須寫成「2024–2025
  # 全部可得資料」，並完整揭露 observed/reconstructed coverage。
  available_data_contract:
    status: decided
    population_id: available_2024_2025_v1
    interpretation: complete_formal_result_over_all_available_samples
    provider_followup_required: false
    unknown_provider_metadata_policy: preserve_unknown_and_use_versioned_project_contract
    do_not_claim: provider_confirmed_best_forecast_cycle

  # OCM-SVD-Analysis 已採相同的跨月 stable-sort/prefer-last 去重。LBT 另外要求連續
  # forcing：單一缺時與整段缺時都必須先通過 blocked cross-validation，重建 provenance
  # 逐時保存；未通過時改用 gap-safe arrival window，不把所有軌跡停在缺口。
  time_axis_contract:
    canonicalization_policy: sort_and_deduplicate_prefer_last
    expected_timestep_hours: 1.0
    short_gap_missing_steps: 1
    short_gap_candidate_method: component_linear_interpolation
    long_gap_candidate_method: multivariate_eof_harmonic_state_space_bidirectional_smoother
    pure_dineof_for_whole_missing_snapshot_allowed: false
    validation: blocked_mask_actual_gap_shapes_plus_eulerian_and_lagrangian_skill
    baseline_fallback: gap_safe_stratified_arrival_windows
    preserve_origin_labels: [observed, reconstructed_short, reconstructed_state_space]
  # OCM 兩種時間支撐擇一，加上 NWW 完整逐時 manifest，均由 SERVER 實值驗證產生；
  # null 是實作 gate，不是等待外部資料。
  ocm_gap_reconstruction_manifest: null
  # 若長缺口重建未達預登錄門檻，以此 manifest 證明 50 個分層時次及核定 horizon
  # 全程不跨缺口；正式 release 接受兩種 OCM 時間支撐方案至少一種。
  ocm_gap_safe_arrival_manifest: null
  nww_full_hourly_analysis_manifest: null

  ocm_contract:
    required_schema_major: 3
    accepted_statuses: [ready]
    # partial month 是全部可得資料母體的一部分；缺日不能改名為完整月，但也不再等待補件。
    accepted_cache_kinds: [standard_month, standard_partial_month]
    required_month_arrays:
      - time_utc_ns.npy
      - hvel.npy
      - vertical_velocity.npy
      - zcor.npy
      - elev.npy
      - wetdry_elem.npy
      - diffusivity.npy
    required_grid_arrays:
      - source_lon.npy
      - source_lat.npy
      - source_face_nodes_local.npy
      - source_face_node_count.npy
      - source_depth_m.npy
      - source_node_bottom_index.npy
      - source_face_global_index.npy

  nww_contract:
    required_schema_major: 1
    # trial_ready 僅表示 lexical cycle selection 不宣稱最佳 forecast lead；在供應者不可考
    # 的前提下，研究端以固定選取與 audit 契約正式採用，不再要求改寫上游 status。
    accepted_statuses: [ready, trial_ready]
    accepted_cache_kinds: [ocm_analysis_grid_resample_from_nww3_native]
    required_arrays:
      - time_utc_ns.npy
      - significant_wave_height.npy
      - peak_frequency.npy
      - peak_direction_raw_deg.npy
      - valid_mask_wave.npy
      - qc_flags.npy
    # 1.5 小時只限制完整逐時產品內的 RK stage 線性內插。SERVER nww3_native 已有
    # 2024-01-01 00:00 至 2025-12-31 23:00 共 17,544 個連續逐時 UTC；analysis 將以
    # 靜態 OCM grid 重建完整時間軸，不沿用 gappy OCM target times。
    maximum_time_gap_hours: 1.5
    source_native_time_coverage: complete_17544_hourly_steps
    analysis_time_support_policy: superset_of_ocm_observed_and_reconstructed_times

study_area:
  # A-D 是四個 forcing flow domains；正式情境與成果的第一層單元則是五個 study sites。
  # 貢寮與龜山島共用 A 區 forcing，但 receptor、scenario、seed、event 與 aggregate 必須分開。
  expected_flow_domain_count: 4
  expected_analysis_region_count: 4
  expected_study_site_count: 5
  primary_analysis_unit: study_site
  secondary_aggregation_unit: analysis_region
  # 兩個 anchor-centered local domains 可反映相連水動力環境而互相重疊；不得為了
  # 強迫互斥而以任意 Voronoi 或緯度線切割，亦不得在聚合時把重疊區自動扣除。
  allow_overlapping_local_domains: true
  # 貢寮與龜山島的水動力互通由同一 A 區 forcing 表達。每條軌跡仍只以自己的
  # local domain 定義主要入口；穿越另一站 local domain 只寫非終止診斷事件，
  # 不改變 study_site_id、scenario 歸屬、停止條件或主要統計分母。
  shared_forcing_domain_preserves_hydrodynamic_connectivity: true
  primary_local_boundary_scope: own_study_site_only
  other_site_local_domain_crossing_policy: record_nonterminating_diagnostic_only

domains:
  # 四列只定義 forcing 支撐、metric CRS 與外層停止邊界；情境數由下方五個
  # study_sites 決定。bbox/center 沿用 OCM-Data-Preprocessing flow-domain v3。
  - analysis_region_id: A
    analysis_region_name_zh: 東北角海域
    flow_domain_id: northeast_taiwan_common_cache_v3
    center_lonlat: [122.05, 25.05]
    bbox_lon_lat: [121.306315, 122.793685, 24.600844, 25.499156]
    metric_crs_policy: local_azimuthal_equidistant
    # SERVER preflight 顯示龜山島 25 km local boundary 至本 bbox 南界只餘約 1.64 km，
    # 小於兩個約 1 km OCM surface/NWW 共同格點。現行 v3 可作開發與 pilot，正式
    # release 必須使用不覆寫 v3 的 expanded domain；新識別碼由產物生成後填入。
    current_domain_role: development_and_pilot
    formal_release_flow_domain_id: null
    formal_release_domain_status: expanded_domain_generation_required
    expanded_domain_candidate_id: northeast_taiwan_common_cache_v4_lbt_south_expanded
    expanded_bbox_lon_lat: [121.306315, 122.793685, 24.480000, 25.499156]
    expanded_south_boundary_at_or_south_of_deg: 24.48
    minimum_common_forcing_margin_grid_cells: 2
    margin_required_for_forcings: [ocm_native, ocm_surface, nww3_analysis]
    radius_25000_formal_requires_expanded_domain: true
    radius_35000_formal_requires_expanded_domain: true
  - analysis_region_id: B
    analysis_region_name_zh: 新竹外海
    flow_domain_id: hsinchu_cache_v3
    center_lonlat: [120.45, 24.75]
    bbox_lon_lat: [119.70812, 121.19188, 24.300844, 25.199156]
    metric_crs_policy: local_azimuthal_equidistant
  - analysis_region_id: C
    analysis_region_name_zh: 後灣海域
    flow_domain_id: houwan_nmmba_cache_v3
    center_lonlat: [120.893355, 22.0]
    bbox_lon_lat: [120.16671, 121.62, 21.550844, 22.449156]
    metric_crs_policy: local_azimuthal_equidistant
  - analysis_region_id: D
    analysis_region_name_zh: 連江海域
    flow_domain_id: lienchiang_common_cache_v3
    center_lonlat: [119.95, 26.2]
    bbox_lon_lat: [119.19912, 120.70088, 25.750844, 26.649156]
    metric_crs_policy: local_azimuthal_equidistant

study_sites:
  # 貢寮與龜山島不沿用過小的 surface-SVD candidate bbox。兩站均以 anchor 為中心，
  # 在 Azimuthal Equidistant CRS 產生半徑 12.5 km 受體核心與 25 km local domain，
  # 再與 A 區固定 OCM ocean polygon 相交。動態 wet/dry 只篩受體與 forcing stage，
  # 不得使 boundary 隨 arrival time 改變；20/35 km 是預先登錄的尺度敏感度。
  - study_site_id: gongliao
    study_site_name_zh: 貢寮
    analysis_region_id: A
    flow_domain_id: northeast_taiwan_common_cache_v3
    anchor_lonlat: [121.92807, 25.11245]
    receptor_core_radius_m: 12500
    local_domain_baseline_radius_m: 25000
    local_domain_sensitivity_radii_m: [20000, 35000]
    minimum_flow_domain_margin_local_grid_scales: 2
    radius_35000_requires_expanded_flow_domain: true
    geometry_generator: anchor_centered_azimuthal_equidistant_buffer_intersect_static_ocm_ocean_polygon
    local_domain_overlap_policy: allowed_preserve_site_identity
    legacy_candidate_bbox_lon_lat_provenance_only: [121.91, 122.06, 25.00, 25.15]
  - study_site_id: guishan
    study_site_name_zh: 龜山島西側
    analysis_region_id: A
    flow_domain_id: northeast_taiwan_common_cache_v3
    anchor_lonlat: [121.951606, 24.843127]
    receptor_core_radius_m: 12500
    local_domain_baseline_radius_m: 25000
    local_domain_sensitivity_radii_m: [20000, 35000]
    minimum_flow_domain_margin_local_grid_scales: 2
    radius_35000_requires_expanded_flow_domain: true
    geometry_generator: anchor_centered_azimuthal_equidistant_buffer_intersect_static_ocm_ocean_polygon
    local_domain_overlap_policy: allowed_preserve_site_identity
    legacy_candidate_bbox_lon_lat_provenance_only: [121.81, 121.97, 24.76, 24.92]
  - study_site_id: hsinchu
    study_site_name_zh: 新竹外海
    analysis_region_id: B
    flow_domain_id: hsinchu_cache_v3
    anchor_policy: flow_domain_center_snap_to_persistent_wet_mesh
    local_domain_policy: same_as_flow_domain
  - study_site_id: houwan
    study_site_name_zh: 後灣海生館
    analysis_region_id: C
    flow_domain_id: houwan_nmmba_cache_v3
    anchor_policy: flow_domain_center_snap_to_persistent_wet_mesh
    local_domain_policy: same_as_flow_domain
  - study_site_id: lienchiang
    study_site_name_zh: 連江
    analysis_region_id: D
    flow_domain_id: lienchiang_common_cache_v3
    anchor_policy: flow_domain_center_snap_to_persistent_wet_mesh
    local_domain_policy: same_as_flow_domain

geometry:
  # 幾何生成規則已決定；null 表示尚未以 SERVER OCM mesh 實際產出與驗證 polygon/受體。
  domain_manifest: null
  local_domain_manifest: null
  # 需保存 local/flow polygon exterior 中的 open-water 線段；其餘邊界才可分類為海岸。
  open_boundary_manifest: null
  receptor_manifest: null
  reporting_region_manifest: null
  geometry_decision_status: decided_generation_pending_server_mesh
  reject_invalid_geometry: true
  coordinate_round_trip_tolerance_m: 0.05

forcing:
  ocm:
    horizontal_mesh: native_schism_faces
    quad_split_policy: deterministic_quality_diagonal
    horizontal_interpolation: barycentric_require_all_vertices
    vertical_interpolation: linear_bracketing_finite_zcor_no_extrapolation
    time_interpolation: linear_no_extrapolation
    z_coordinate: m_positive_up
    hvel_unit: m_per_s
    vertical_velocity_unit: m_per_s
    diffusivity_unit: m2_per_s
    wetdry_semantics_decision_status: derived_pending_server_preflight

  nww3:
    horizontal_interpolation: mask_aware_bilinear_require_all_corners
    time_interpolation: linear_no_extrapolation
    peak_period_source: reciprocal_of_peak_frequency
    direction_convention: wave_from_north_clockwise
    propagation_conversion: add_180_degrees
    # WAVEWATCH III legacy 定義與山陀兒、康芮兩個獨立事件已形成研究端採用契約；
    # 供應者不可考不影響此版本化決策，日後只有反證才另立新版。
    convention_evidence_status: approved
    convention_contract_id: nww3_dp_wnd_two_typhoon_adopted_v1

physics:
  # 本工項以完全沉沒物體為基線，因此不加入 windage。
  include_windage: false

  stokes:
    enabled: true
    formulation: finite_depth_monochromatic_bulk
    wave_height_source: significant_wave_height
    period_source: peak_frequency
    direction_source: peak_direction_raw_deg
    dispersion_relation: omega_squared_equals_gk_tanh_kh
    gravity_mps2: 9.80665
    # 完整逐時 analysis 產製後，這裡只處理空間必要欄位、manifest/checksum/I/O 或局部
    # 取樣失敗；不能把舊 target-time 缺口留到 runtime 當作正常終止。
    invalid_wave_policy: stop_with_wave_data_gap
    required_sensitivity_cases:
      - no_stokes
      - deep_water_bulk
      - finite_depth_bulk

  settling:
    # 未有材質、粒徑、密度或生物附著量測，因此十類是涵蓋三個數量級的垂向行為
    # 敏感度基線，不是十種具名廢棄物的校準值。正式 material manifest 必須由本表
    # 確定性生成並保存 design_version，不得在 batch 前任意改值。
    material_manifest: null
    expected_material_count: 10
    settling_negative_rising_positive: true
    velocity_unit: m_per_s
    design_decision_status: decided_behavior_classes
    behavior_classes:
      - {material_id: sink_100mmps, settling_velocity_mps: -0.100, behavior_class: sinking}
      - {material_id: sink_030mmps, settling_velocity_mps: -0.030, behavior_class: sinking}
      - {material_id: sink_010mmps, settling_velocity_mps: -0.010, behavior_class: sinking}
      - {material_id: sink_003mmps, settling_velocity_mps: -0.003, behavior_class: sinking}
      - {material_id: sink_001mmps, settling_velocity_mps: -0.001, behavior_class: sinking}
      - {material_id: neutral_000mmps, settling_velocity_mps: 0.000, behavior_class: suspended}
      - {material_id: rise_001mmps, settling_velocity_mps: 0.001, behavior_class: rising}
      - {material_id: rise_003mmps, settling_velocity_mps: 0.003, behavior_class: rising}
      - {material_id: rise_010mmps, settling_velocity_mps: 0.010, behavior_class: rising}
      - {material_id: rise_030mmps, settling_velocity_mps: 0.030, behavior_class: rising}

  horizontal_diffusion:
    # 常數 Kh 是解析／統計 reference；Smagorinsky 需通過空變 K 與 well-mixed 測試。
    reference_method: constant
    baseline_method_decision_status: decided_constant_value_pending_validation_pilot
    constant_kh_m2ps: null
    smagorinsky:
      formula: proposal_equation_10_metric_triangle_gradient
      cs_sensitivity: [0.10, 0.15, 0.20]
      delta_policy: sqrt_local_triangle_area_m
      kh_floor_m2ps: null
      kh_cap_m2ps: null
      variable_diffusivity_gradient_drift_required: true
      enable_only_after_well_mixed_validation: true

  vertical_diffusion:
    reference_method: constant
    constant_kz_m2ps: null
    ocm_candidate_array: diffusivity.npy
    baseline_method_decision_status: decided_constant_value_pending_validation_pilot
    variable_diffusivity_gradient_drift_required: true

integration:
  deterministic_method: rk4
  # 速度函式永遠回傳物理時間向前的速度；backward 只由負 dt 表示，禁止雙重反號。
  time_direction: backward_negative_dt
  # RK4 只處理確定性 drift；常數 K reference 的隨機增量以獨立 Euler-Maruyama
  # operator split 加入。split 順序須由解析／統計測試固定，但不再詢問使用者選項。
  stochastic_method: operator_split_euler_maruyama_reference
  stochastic_variance_uses_absolute_dt: true
  output_interval_seconds: null
  dt_min_seconds: null
  dt_max_seconds: null
  maximum_horizontal_cfl_fraction: 0.25
  maximum_vertical_layer_fraction: 0.25
  maximum_diffusive_rms_fraction: 0.25
  forcing_time_boundary_substep: true

boundaries:
  # 巢狀 local boundary 用於回答「如何移入關注海域」；東北角兩站離開 local domain
  # 只記錄事件並繼續回溯，直到外層 flow domain。B/C/D 兩層重合時只寫一個 crossing。
  local_domain_first_exit: record_first_crossing_and_continue
  # `local_domain_first_exit` 只屬於 scenario 自己的站點。foreign-local crossing 用來
  # 描述共享傳輸走廊，不得觸發停止、改變 scenario 所屬或混入主要入口 KDE 分母。
  other_site_local_domain_enter: record_diagnostic_and_continue
  other_site_local_domain_exit: record_diagnostic_and_continue
  other_site_local_domain_changes_study_site: false
  local_open_boundary_segment_policy: metric_circle_arcs_connected_to_valid_ocean_exclude_coastline
  flow_domain_open_boundary: stop_at_first_crossing
  coast_baseline: stop_and_record_contact
  surface_suspended_or_sinking: reflect_and_record_contact
  surface_rising: stop_as_surface_regime_exit
  bed_suspended: reflect_and_record_contact
  bed_sinking_or_near_bed: deposit_on_first_contact_and_stop
  stop_at_forcing_start: true
  # 已知 OCM 缺時必須在啟動前由 approved reconstruction 或 gap-safe arrival/horizon
  # 消化；此開關只保留給 manifest 外缺檔、checksum/I/O 損毀、空間支撐或重建失敗。
  stop_at_data_gap: true
  # 最大回溯期不是任意人工選值；比較 7/14/30/60 日後，取主要統計最小穩定尺度。
  max_backtrack_days: null
  max_backtrack_candidate_days: [7, 14, 30, 60]
  max_backtrack_decision_status: derived_by_horizon_stability_pilot
  maximum_step_count: null
  required_sensitivity_cases:
    - coast_reflect
    - bed_reflect
    - near_bed_deposit
    - expanded_domain

scenarios:
  receptor_manifest: null
  # 五個站點各以 5 個 deterministic maximin 水平位置 × 4 個垂向層位形成 20 個
  # 三維 receptors；貢寮／龜山島各有完整 20 個，不在 A 區內分配或共用。
  expected_receptor_count_per_site: 20
  expected_receptor_count: 100
  horizontal_receptor_count_per_site: 5
  vertical_receptor_count_per_horizontal_location: 4
  horizontal_selector: anchor_first_then_deterministic_metric_maximin_on_persistent_wet_mesh
  northeast_receptor_candidate_domain: site_receptor_core_12500m
  other_site_receptor_candidate_domain: site_flow_domain
  vertical_targets:
    - {vertical_id: upper_water_column, fraction_below_surface: 0.10}
    - {vertical_id: mid_upper_water_column, fraction_below_surface: 0.40}
    - {vertical_id: mid_lower_water_column, fraction_below_surface: 0.70}
    - {vertical_id: near_bed, policy: lowest_valid_ocm_layer_center}
  receptor_design_decision_status: decided_coordinates_pending_server_mesh
  arrival_time_manifest: null
  # 每站點皆須有 50 個 arrival-time 條件；貢寮／龜山島優先配對 UTC，但潮位相位、
  # forcing coverage 與極端事件標籤仍逐站點計算。
  expected_arrival_time_count_per_site: 50
  material_manifest: null
  expected_material_count: 10

  # 每站點 10,000 = 10×20×50；A 區含兩個獨立站點，故為 20,000；全案五站點
  # 合計 50,000。這些數量不含 no-Stokes 等 experiment cases 或 stochastic members。
  design: five_independent_sites_each_full_factorial_10x20x50
  scenario_count_per_site: 10000
  scenario_count_region_A: 20000
  scenario_count: 50000
  scenario_count_decision_status: decided
  scenario_id_fields:
    - study_site_id
    - material_id
    - receptor_id
    - arrival_time_id
    - design_version

  # `members_per_scenario` 代表同一組固定參數下，以不同亂數種子或 forcing 擾動
  # 產生的獨立軌跡數。若所有情境使用相同 M，每站點為 10,000 × M、
  # A 區為 20,000 × M、全案為 50,000 × M。完全確定性案例 M=1。null 表示
  # 正式 M 尚須由 member-convergence 曲線決定，
  # 不得把計畫書中的 1,000 當成 M，也不得用未驗證的任意值啟動正式批次。
  members_per_scenario: null
  members_decision_status: derived_by_registered_convergence
  master_seed: null
  seed_policy: hash_master_scenario_member

arrival_time_selection:
  # 48+2 的分層與選取演算法已決定；確切 UTC 只能從 SERVER forcing 與潮位序列
  # 衍生。三個相位是潮位導數 proxy，不宣稱為現場量測的三維最大漲／退潮流。
  core_design: two_years_by_four_seasons_by_spring_neap_by_three_tidal_phase_proxies
  core_count: 48
  tidal_phase_proxies: [fastest_rising, fastest_falling, slack]
  event_supplement_count: 2
  event_supplements: [local_high_wave, local_strong_current]
  deterministic_tie_break: forcing_completeness_then_boundary_safety_then_earliest_utc
  northeast_pair_utc_when_coverage_allows: true
  decision_status: decided_algorithm_timestamps_pending_server_data

execution:
  reference_backend: numpy
  production_backend: numba
  shard_scenario_count: null
  checkpoint_interval_output_steps: null
  fail_if_dirty_git: true
  atomic_publish: true
  input_change_policy: reject_resume

outputs:
